<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Knox Knows</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, system-ui, sans-serif; background: #FFF8F0; color: #3C3C3C; text-align: center; padding: 24px; }
    @media (prefers-color-scheme: dark) { body { background: #120E17; color: #EDEDED; } }
    .box { max-width: 320px; }
    .fox { font-size: 56px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { margin: 0 0 20px; color: #777; line-height: 1.5; }
    button { border: 0; border-radius: 14px; padding: 13px 22px; background: #FF6B00; color: #fff;
      font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #CC5500; }
  </style>
</head>
<body>
  <!-- Shown only when the app can't reach knoxknowsapp.com (e.g. offline). -->
  <div class="box">
    <div class="fox">🦊</div>
    <h1>Can't reach Knox</h1>
    <p>Check your internet connection, then try again.</p>
    <button onclick="location.href='https://www.knoxknowsapp.com/app'">Try again</button>
  </div>
</body>
</html>
