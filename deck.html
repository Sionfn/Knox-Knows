<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Same look as the rest of Knox (light or dark, chosen in the app).
    (function () { try { if (localStorage.getItem('knoxTheme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {} })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A shared flashcard deck · Knox Knows</title>
  <meta name="description" content="Someone shared a Knox Knows flashcard deck with you. Add it to your decks and study it free.">
  <meta property="og:title" content="A Knox Knows flashcard deck">
  <meta property="og:description" content="Add it to your decks and study it free on Knox Knows.">
  <meta property="og:image" content="https://www.knoxknowsapp.com/knox-share.jpg">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900;1000&display=swap" rel="stylesheet">
  <style>
    :root { --orange:#FF6B00; --orange-dark:#CC5500; --green:#58CC02; --green-dark:#46A302; --green-light:#D7FFB8; --blue:#1CB0F6; --blue-light:#D7F2FD;
            --bg:#F7F7F7; --surface:#FFFFFF; --border:#E5E5E5; --text:#3C3C3C; --text-light:#777; --body:#555; }
    html[data-theme="dark"] { --bg:#1F1F23; --surface:#29292E; --border:#34343D; --text:#EDEDED; --text-light:#9B9BA3; --body:#C2C2CA; --green-light:#33620E; --blue-light:#0E4A62; color-scheme:dark; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Nunito', system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    header { height:64px; display:flex; align-items:center; gap:10px; padding:0 18px; background:var(--orange); border-bottom:3px solid var(--orange-dark); }
    header a { display:flex; align-items:center; gap:10px; color:#fff; text-decoration:none; font-weight:900; font-size:19px; }
    header img { width:40px; height:40px; border-radius:50%; border:3px solid #fff; }
    main { max-width:760px; margin:0 auto; padding:28px 16px 60px; }
    .card { background:var(--surface); border:2px solid var(--border); border-radius:24px; box-shadow:0 5px 0 var(--border); }
    .head { padding:24px; border-color:var(--green); box-shadow:0 5px 0 var(--green-dark); }
    .tag { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border-radius:999px; background:var(--green-light); border:2px solid var(--green); font-size:13px; font-weight:900; color:var(--text); }
    h1 { font-size:clamp(28px, 6vw, 40px); font-weight:1000; letter-spacing:-.02em; margin:14px 0 6px; line-height:1.1; }
    .meta { font-size:15px; font-weight:800; color:var(--text-light); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:52px; padding:0 22px; border-radius:16px; font-size:16px; font-weight:900; text-decoration:none; border:2px solid transparent; font-family:inherit; }
    .btn:active { transform:translateY(3px); }
    .btn-green { background:var(--green); color:#fff; border-color:var(--green-dark); box-shadow:0 5px 0 var(--green-dark); }
    .btn-dark { background:#111; color:#fff; border-color:#000; box-shadow:0 5px 0 #000; }
    html[data-theme="dark"] .btn-dark { background:#fff; color:#111; border-color:#ccc; box-shadow:0 5px 0 #999; }
    .btn-plain { background:var(--surface); color:var(--text); border-color:var(--border); box-shadow:0 5px 0 var(--border); }
    .note { margin-top:14px; font-size:13.5px; font-weight:700; color:var(--text-light); }
    .list { display:grid; gap:12px; margin-top:22px; }
    .item { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0; overflow:hidden; }
    .item > div { padding:16px; }
    .item > div + div { border-left:2px solid var(--border); }
    .item small { display:block; font-size:10.5px; font-weight:900; letter-spacing:.1em; margin-bottom:6px; }
    .item .q small { color:var(--blue); } .item .a small { color:var(--green-dark); }
    html[data-theme="dark"] .item .a small { color:var(--green); }
    .item p { font-size:15.5px; font-weight:800; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
    .item img { display:block; width:100%; max-height:140px; object-fit:contain; margin-top:10px; border-radius:10px; }
    .item .credit { font-size:11px; font-weight:700; color:var(--text-light); margin-top:4px; }
    .state { text-align:center; padding:40px 20px; }
    .state img { width:84px; height:84px; border-radius:24px; border:3px solid var(--orange); box-shadow:0 4px 0 var(--orange-dark); }
    .state h1 { font-size:26px; }
    .state p { font-weight:700; color:var(--body); margin:8px 0 20px; }
    .more { text-align:center; margin-top:28px; font-weight:800; color:var(--text-light); font-size:14px; }
    .more a { color:var(--orange); }
    @media (max-width:560px) { .item { grid-template-columns:1fr; } .item > div + div { border-left:0; border-top:2px solid var(--border); } .actions .btn { flex:1 1 100%; } }
  </style>
</head>
<body>
  <header><a href="/about"><img src="/knox-logo-square.jpg" alt="">Knox Knows</a></header>
  <main id="deck"><div class="card state"><p>Opening the deck…</p></div></main>
  <script>
    (function () {
      var id = (location.pathname.split('/deck/')[1] || new URLSearchParams(location.search).get('id') || '').replace(/[^A-Za-z0-9]/g, '');
      var main = document.getElementById('deck');
      var esc = function (s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; };
      var safeImg = function (u) { return /^https:\/\/(upload|thumb)\.wikimedia\.org\//.test(u || '') || /^data:image\/(jpeg|png|webp);base64,/.test(u || '') ? u : ''; };
      var isApple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var problem = function (title, text) {
        main.innerHTML = '<div class="card state"><img src="/knox-logo-square.jpg" alt=""><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p><a class="btn btn-green" href="/app">Make your own decks, free</a></div>';
      };
      if (!id) return problem('That link isn’t right', 'Ask for the deck link again.');
      fetch('/api/me?route=share-deck&id=' + encodeURIComponent(id)).then(function (r) {
        return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'This deck can’t be opened.'); return j.deck; });
      }).then(function (deck) {
        document.title = deck.title + ' · Knox Knows flashcards';
        var n = deck.cardCount || deck.cards.length;
        var html = '<section class="card head"><span class="tag">🃏 Flashcard deck</span><h1>' + esc(deck.title) + '</h1>' +
          '<div class="meta">' + n + ' card' + (n === 1 ? '' : 's') + (deck.by ? ' · shared by ' + esc(deck.by) : '') + '</div>' +
          '<div class="actions"><a class="btn btn-green" href="/app?add_deck=' + encodeURIComponent(id) + '">Add to my decks</a>' +
          (isApple ? '<a class="btn btn-dark" href="knoxknows://deck/' + encodeURIComponent(id) + '">Open in the Knox Knows app</a>' : '') +
          '</div><p class="note">Adding it makes your own copy — study it, edit it, it’s yours. It’s free.</p></section><div class="list">';
        deck.cards.forEach(function (c) {
          var img = safeImg(c.image);
          html += '<div class="card item"><div class="q"><small>QUESTION</small><p>' + esc(c.front) + '</p></div>' +
            '<div class="a"><small>ANSWER</small><p>' + esc(c.back) + '</p>' +
            (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' + (c.imageCredit ? '<div class="credit">' + esc(c.imageCredit) + '</div>' : '') : '') +
            '</div></div>';
        });
        html += '</div><p class="more">Make your own decks with Knox — from a topic, your notes or a photo. <a href="/about">See Knox Knows</a></p>';
        main.innerHTML = html;
      }).catch(function (e) { problem('This deck can’t be opened', e.message || 'Please try again.'); });
    })();
  </script>
</body>
</html>
