<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FF6B00">
  <title>Admin — Knox Knows</title>
  <link rel="icon" type="image/jpeg" href="/knox-logo-square.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange:        #FF6B00;
      --orange-dark:   #CC5500;
      --orange-light:  #FFE0C2;
      --orange-cream:  #FFF8F0;
      --blue:          #1CB0F6;
      --blue-dark:     #0A85C2;
      --blue-light:    #D7F2FD;
      --green:         #58CC02;
      --green-dark:    #46A302;
      --green-light:   #D7FFB8;
      --red:           #FF4B4B;
      --red-light:     #FEE2E2;
      --yellow:        #FFD900;
      --purple:        #CE82FF;
      --purple-light:  #F3E8FF;
      --cream:         #FFF8F0;
      --gray:          #F7F7F7;
      --border:        #E5E5E5;
      --text:          #3C3C3C;
      --text-light:    #777;
    }
    html, body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background: var(--gray);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: var(--orange); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ─── HEADER ─────────────────────────────────────────── */
    header {
      background: var(--orange);
      border-bottom: 4px solid var(--orange-dark);
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .h-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .h-logo {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 3px solid white;
      object-fit: cover;
      background: var(--orange-light);
    }
    .h-title {
      display: flex; flex-direction: column;
      line-height: 1.1;
    }
    .h-title-main {
      font-size: 17px; font-weight: 900;
      color: white;
      letter-spacing: -0.01em;
    }
    .h-title-sub {
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .h-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .h-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.4);
      color: white;
      border-radius: 12px;
      padding: 9px 16px;
      font-size: 13px; font-weight: 800;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .h-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-1px); }
    .h-btn:active { transform: translateY(1px); }
    .h-status {
      font-size: 11px; font-weight: 800;
      color: white;
      background: rgba(255,255,255,0.15);
      padding: 6px 12px;
      border-radius: 999px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .h-status.live::before {
      content: '';
      display: inline-block;
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: 1px;
      box-shadow: 0 0 0 0 rgba(74,222,128,0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(74,222,128,0.6); }
      70%  { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }

    /* ─── LAYOUT ─────────────────────────────────────────── */
    main { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }

    .section-title {
      font-size: 13px; font-weight: 900;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 32px 0 14px;
    }
    .section-title:first-child { margin-top: 0; }

    .grid {
      display: grid;
      gap: 16px;
    }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }

    /* ─── METRIC CARDS ─────────────────────────────────────── */
    .card {
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 4px 0 var(--border);
    }
    .card-lg { padding: 22px 24px; }

    .metric-card {
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 4px 0 var(--border);
      transition: transform 0.15s;
    }
    .metric-card:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--border); }
    .metric-label {
      font-size: 11px; font-weight: 900;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 32px; font-weight: 900;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .metric-sub {
      font-size: 12px; font-weight: 700;
      color: var(--text-light);
      margin-top: 6px;
    }
    .metric-card.orange { border-color: var(--orange-light); box-shadow: 0 4px 0 var(--orange-light); background: linear-gradient(135deg, white, #FFF8F0); }
    .metric-card.orange .metric-value { color: var(--orange); }
    .metric-card.green  { border-color: #B9F6CA;             box-shadow: 0 4px 0 #B9F6CA;             background: linear-gradient(135deg, white, #F0FFF0); }
    .metric-card.green  .metric-value { color: var(--green-dark); }
    .metric-card.blue   { border-color: var(--blue-light);   box-shadow: 0 4px 0 var(--blue-light);   background: linear-gradient(135deg, white, #F0FAFF); }
    .metric-card.blue   .metric-value { color: var(--blue-dark); }
    .metric-card.purple { border-color: var(--purple-light); box-shadow: 0 4px 0 var(--purple-light); background: linear-gradient(135deg, white, #FAF5FF); }
    .metric-card.purple .metric-value { color: var(--purple); }

    .metric-delta {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
      margin-top: 6px;
    }
    .metric-delta.up   { background: var(--green-light); color: var(--green-dark); }
    .metric-delta.down { background: var(--red-light);   color: var(--red); }
    .metric-delta.flat { background: var(--gray);        color: var(--text-light); }

    /* ─── PROGRESS BARS ───────────────────────────────────── */
    .bar-row { margin-bottom: 14px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .bar-label-value { font-size: 12px; color: var(--text-light); font-weight: 700; }
    .bar-track {
      width: 100%;
      height: 10px;
      background: var(--gray);
      border-radius: 999px;
      overflow: hidden;
      border: 1.5px solid var(--border);
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
    }
    .bar-fill.orange { background: linear-gradient(90deg, var(--orange), #FF8C42); }
    .bar-fill.green  { background: linear-gradient(90deg, var(--green),  #7BE036); }
    .bar-fill.blue   { background: linear-gradient(90deg, var(--blue),   #5AC8FA); }
    .bar-fill.purple { background: linear-gradient(90deg, var(--purple), #DEA6FF); }
    .bar-fill.red    { background: linear-gradient(90deg, var(--red),    #FF7878); }

    /* ─── SIGNUP MINI-CHART ────────────────────────────── */
    .spark-wrap {
      display: flex; align-items: flex-end; gap: 4px;
      height: 80px;
      margin-top: 12px;
    }
    .spark-bar {
      flex: 1;
      background: linear-gradient(180deg, var(--orange), var(--orange-light));
      border-radius: 4px 4px 2px 2px;
      min-height: 2px;
      transition: height 0.6s cubic-bezier(0.16,1,0.3,1);
      position: relative;
      cursor: default;
    }
    .spark-bar:hover { background: linear-gradient(180deg, var(--orange-dark), var(--orange)); }
    .spark-bar:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%; left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      margin-bottom: 6px;
      pointer-events: none;
    }
    .spark-x-labels {
      display: flex; gap: 4px; margin-top: 8px;
    }
    .spark-x-label {
      flex: 1;
      font-size: 9px;
      color: var(--text-light);
      text-align: center;
      font-weight: 700;
    }

    /* ─── FEEDBACK SCORE RING ───────────────────────── */
    .score-ring-wrap {
      display: flex; align-items: center; gap: 24px;
      flex-wrap: wrap;
    }
    .score-ring {
      position: relative;
      width: 140px; height: 140px;
      flex-shrink: 0;
    }
    .score-ring svg {
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .score-ring-bg { fill: none; stroke: var(--gray); stroke-width: 12; }
    .score-ring-fill { fill: none; stroke: var(--green); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 0.9s cubic-bezier(0.16,1,0.3,1); }
    .score-ring-text {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      line-height: 1;
    }
    .score-ring-pct { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -0.02em; }
    .score-ring-label { font-size: 10px; font-weight: 900; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    .score-summary { flex: 1; min-width: 200px; }
    .score-stat {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1.5px solid var(--border);
      font-size: 14px;
    }
    .score-stat:last-child { border-bottom: none; }
    .score-stat-label { font-weight: 700; color: var(--text-light); }
    .score-stat-value { font-weight: 900; color: var(--text); }
    .score-stat-value.up   { color: var(--green-dark); }
    .score-stat-value.down { color: var(--red); }

    /* ─── TABLES ──────────────────────────────────────── */
    .data-list { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; padding-right: 4px; }
    .data-list::-webkit-scrollbar { width: 8px; }
    .data-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    .data-row {
      background: var(--gray);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      transition: border-color 0.15s;
    }
    .data-row:hover { border-color: var(--orange-light); }
    .data-row-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .row-question {
      font-size: 13px; font-weight: 800;
      color: var(--text);
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }
    .row-answer {
      font-size: 12px; font-weight: 600;
      color: var(--text-light);
      line-height: 1.5;
      margin-top: 4px;
      word-break: break-word;
    }
    .tag {
      display: inline-block;
      font-size: 9px; font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .tag-up    { background: var(--green-light); color: var(--green-dark); }
    .tag-down  { background: var(--red-light);   color: var(--red); }
    .tag-plan-free   { background: var(--gray);          color: var(--text-light); border: 1.5px solid var(--border); }
    .tag-plan-super  { background: var(--green-light);   color: var(--green-dark); }
    .tag-plan-max    { background: var(--orange-light);  color: var(--orange); }
    .tag-plan-plus   { background: var(--green-light);   color: var(--green-dark); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
      font-weight: 700;
      font-size: 14px;
    }
    .empty-state-emoji { font-size: 40px; margin-bottom: 12px; display: block; }

    /* ─── AUTH GATE ───────────────────────────────────── */
    #authGate {
      position: fixed; inset: 0;
      background: var(--orange-cream);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    #authGate .gate-card {
      background: white;
      border-radius: 24px;
      max-width: 380px;
      width: 100%;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.18);
    }
    .gate-header {
      background: var(--orange);
      border-bottom: 4px solid var(--orange-dark);
      padding: 32px 28px;
      text-align: center;
    }
    .gate-header img {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 3px solid white;
      margin: 0 auto 10px;
      object-fit: cover;
      display: block;
    }
    .gate-header h1 {
      font-size: 22px; font-weight: 900;
      color: white;
      letter-spacing: -0.01em;
    }
    .gate-header p {
      font-size: 12px; font-weight: 700;
      color: rgba(255,255,255,0.85);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .gate-body {
      padding: 24px 28px 28px;
      text-align: center;
    }
    .gate-msg {
      font-size: 14px; font-weight: 700;
      color: var(--text-light);
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .gate-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--orange);
      color: white;
      font-size: 14px; font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      box-shadow: 0 4px 0 var(--orange-dark);
      transition: all 0.15s;
    }
    .gate-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 var(--orange-dark); }
    .gate-btn:active { transform: translateY(2px);  box-shadow: none; }

    /* ─── LOADING ──────────────────────────────────── */
    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 80px 20px;
      gap: 12px;
      color: var(--text-light);
      font-weight: 800;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── ERROR ──────────────────────────────────────── */
    .error-banner {
      background: #FEF2F2;
      border: 2px solid #FECACA;
      border-radius: 16px;
      padding: 16px 20px;
      color: var(--red);
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* ─── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 900px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      header { padding: 12px 14px; }
      .h-title-main { font-size: 15px; }
      .h-title-sub  { font-size: 10px; }
      main { padding: 20px 14px 50px; }
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .metric-value { font-size: 26px; }
      .score-ring { width: 120px; height: 120px; }
      .score-ring-pct { font-size: 24px; }
    }
    @media (max-width: 480px) {
      /* The status pill and both buttons don't fit beside the title; give them their own row. */
      header { flex-wrap: wrap; gap: 10px; }
      .h-right { width: 100%; gap: 6px; }
      .h-status { margin-right: auto; padding: 6px 10px; font-size: 10px; }
      .h-btn { padding: 8px 10px; font-size: 12px; white-space: nowrap; }
    }
    /* ─── COMPED PLUS ───────────────────────────────────── */
    /* Its heading is the panel's first child, which .section-title:first-child zeroes. */
    #compPanel { margin-top: 40px; }
    .comp-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
    .comp-form input, .comp-form select {
      flex: 1 1 200px; min-width: 0; padding: 11px 14px; border-radius: 12px;
      border: 2px solid var(--border); font: inherit; font-weight: 700; color: var(--text); background: white;
    }
    .comp-form input:focus { outline: none; border-color: var(--orange); }
    .comp-btn {
      padding: 11px 18px; border-radius: 12px; border: none; cursor: pointer;
      background: var(--orange); color: white; font: inherit; font-weight: 900;
      box-shadow: 0 3px 0 var(--orange-dark); white-space: nowrap;
    }
    .comp-btn:disabled { opacity: .6; cursor: default; }
    .comp-msg { margin-top: 10px; font-size: 13px; font-weight: 800; min-height: 18px; }
    .comp-msg.ok { color: var(--green-dark); }
    .comp-msg.err { color: var(--red); }
    .comp-list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
    .comp-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border: 2px solid var(--border); border-radius: 12px; background: var(--gray);
    }
    .comp-who { flex: 1; min-width: 0; }
    .comp-who strong { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .comp-who span { display: block; font-size: 12px; font-weight: 700; color: var(--text-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .comp-tag { font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 6px; background: var(--green-light); color: var(--green-dark); white-space: nowrap; }
    .comp-remove {
      padding: 7px 12px; border-radius: 10px; border: 2px solid var(--border); background: white;
      color: var(--red); font: inherit; font-size: 13px; font-weight: 900; cursor: pointer; white-space: nowrap;
    }
    .comp-empty { margin-top: 16px; font-size: 13px; font-weight: 700; color: var(--text-light); }

    /* ─── SUPPORT INBOX ─────────────────────────────────── */
    #supportPanel { margin-bottom: 36px; }
    #supportPanel .section-title { display: flex; align-items: center; gap: 8px; }
    .si-count { background: var(--red); color: white; border-radius: 999px; padding: 1px 8px; font-size: 11px; letter-spacing: 0; }
    .si-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 0; padding: 0; overflow: hidden; min-height: 420px; }
    .si-list { border-right: 2px solid var(--border); max-height: 620px; overflow-y: auto; }
    .si-filter { display: flex; gap: 6px; padding: 12px; border-bottom: 2px solid var(--border); }
    .si-item { display: block; width: 100%; text-align: left; padding: 12px 14px; border: none; border-bottom: 1.5px solid var(--border); background: white; font: inherit; cursor: pointer; }
    .si-item:hover { background: var(--orange-cream); }
    .si-item.on { background: var(--orange-light); }
    .si-item b { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
    .si-item b span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .si-item time { font-size: 11px; color: var(--text-light); font-weight: 700; flex-shrink: 0; }
    .si-item p { margin: 3px 0 0; font-size: 12.5px; font-weight: 700; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .si-item.new b span::before { content: '● '; color: var(--red); }
    .si-tag { display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 6px; background: var(--gray); color: var(--text-light); }
    .si-tag.waiting { background: var(--orange-light); color: var(--orange-dark); }
    .si-tag.refund { background: var(--red-light); color: var(--red); }
    .si-tag.replied { background: var(--green-light); color: var(--green-dark); }
    .si-view { display: flex; flex-direction: column; min-width: 0; }
    .si-empty { margin: auto; padding: 40px; text-align: center; font-size: 14px; font-weight: 700; color: var(--text-light); }
    .si-head { padding: 14px 18px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .si-head strong { font-size: 15px; }
    .si-facts { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: var(--text-light); white-space: pre-wrap; line-height: 1.5; }
    .si-thread { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; background: var(--cream); }
    .si-msg { max-width: 80%; padding: 9px 13px; border-radius: 14px; font-size: 14px; font-weight: 600; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; background: white; border: 2px solid var(--border); }
    .si-msg small { display: block; font-size: 10.5px; font-weight: 900; color: var(--text-light); margin-bottom: 2px; }
    .si-msg.user { align-self: flex-end; background: var(--orange); border-color: var(--orange); color: white; }
    .si-msg.user small { color: rgba(255,255,255,.8); }
    .si-msg.team { border-color: var(--green); }
    .si-msg.note { align-self: center; background: var(--orange-light); border: none; font-size: 12.5px; font-weight: 800; }
    .si-reply { display: flex; gap: 10px; padding: 12px 14px; border-top: 2px solid var(--border); align-items: flex-end; }
    .si-reply textarea { flex: 1; min-height: 64px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--border); font: inherit; font-weight: 600; }
    .si-reply textarea:focus { outline: none; border-color: var(--orange); }
    @media (max-width: 800px) { .si-wrap { grid-template-columns: 1fr; } .si-list { border-right: none; border-bottom: 2px solid var(--border); max-height: 280px; } }

    /* ─── FREE TRIALS ───────────────────────────────────── */
    .trial-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .trial-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .trial-tab {
      padding: 6px 12px; border-radius: 999px; border: 2px solid var(--border); background: white;
      color: var(--text-light); font: inherit; font-size: 12px; font-weight: 900; cursor: pointer;
    }
    .trial-tab.on { border-color: var(--orange); background: var(--orange); color: white; }
    .trial-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .trial-who { flex: 1 1 220px; min-width: 0; }
    .trial-who strong { display: block; font-size: 14px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trial-who span { display: block; font-size: 12px; font-weight: 700; color: var(--text-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trial-dates { flex: 0 1 auto; font-size: 12px; font-weight: 700; color: var(--text-light); line-height: 1.5; text-align: right; }
    .trial-dates b { color: var(--text); font-weight: 900; }
    .tag-trialing   { background: var(--blue-light);   color: var(--blue-dark); }
    .tag-cancelling { background: var(--orange-light); color: var(--orange-dark); }
    .tag-converted  { background: var(--green-light);  color: var(--green-dark); }
    .tag-failed     { background: var(--red-light);    color: var(--red); }
    .tag-cancelled  { background: var(--gray);         color: var(--text-light); border: 1.5px solid var(--border); }
    @media (max-width: 600px) { .trial-dates { text-align: left; flex-basis: 100%; } }
  </style>
<link rel="stylesheet" href="/logo-theme.css">
<link rel="stylesheet" href="/hover-steady.css">
</head>
<body>

<noscript>
  <div style="padding:32px 24px;text-align:center;font-family:'Nunito',system-ui,sans-serif;background:#FFF8F0;border-bottom:3px solid #FF6B00;">
    <h2 style="font-weight:900;color:#1f2937;margin-bottom:8px;font-size:20px;">Admin dashboard needs JavaScript</h2>
    <p style="color:#666;font-weight:600;font-size:14px;">Please enable JavaScript to view stats.</p>
  </div>
</noscript>

<!-- ─── AUTH GATE — shown until admin auth resolves ─── -->
<div id="authGate">
  <div class="gate-card">
    <div class="gate-header">
      <img src="/knox-logo-square.jpg" alt="Knox" onerror="this.style.display='none'">
      <h1>Admin Console</h1>
      <p>Restricted Access</p>
    </div>
    <div class="gate-body">
      <p class="gate-msg" id="gateMsg">Checking authentication…</p>
      <button class="gate-btn" id="gateBtn" style="display:none;" onclick="handleGateSignIn()">Sign in with Google</button>
    </div>
  </div>
</div>

<!-- ─── DASHBOARD — hidden until auth + data load ─── -->
<header style="display:none;" id="adminHeader">
  <div class="h-left">
    <img src="/knox-logo-square.jpg" alt="Knox" class="h-logo" onerror="this.style.display='none'">
    <div class="h-title">
      <span class="h-title-main">Knox Knows</span>
      <span class="h-title-sub">Admin Console</span>
    </div>
  </div>
  <div class="h-right">
    <span class="h-status live" id="lastUpdated">Loading…</span>
    <button class="h-btn" onclick="loadStats(true)">↻ Refresh</button>
    <button class="h-btn" onclick="handleSignOut()">Sign out</button>
  </div>
</header>

<main style="display:none;" id="adminMain">
  <div id="errorBanner" style="display:none;" class="error-banner"></div>
  <div id="supportPanel"></div>
  <div id="dashboard"></div>
  <div id="compPanel"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyAlu0ARxOD4kmtRSuEoVJaqCDh4lr4_h9E",
    authDomain:        "knox-knows.firebaseapp.com",
    projectId:         "knox-knows",
    storageBucket:     "knox-knows.firebasestorage.app",
    messagingSenderId: "217543758511",
    appId:             "1:217543758511:web:f5451b30eea1918caa3a5a",
  };
  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window._auth = auth;

  // Wait for auth state
  onAuthStateChanged(auth, async (user) => {
    document.getElementById('dashboard').replaceChildren();
    document.getElementById('compPanel').replaceChildren();
    document.getElementById('supportPanel').replaceChildren();
    document.getElementById('authGate').style.display = 'flex';
    document.getElementById('adminHeader').style.display = 'none';
    document.getElementById('adminMain').style.display = 'none';
    if (!user) {
      // Not signed in
      document.getElementById('gateMsg').textContent =
        'Sign in with the admin Google account to continue.';
      document.getElementById('gateBtn').style.display = 'block';
      return;
    }
    // Signed in — try loading stats. If 403, they're not the admin.
    await loadStats();
  });

  window.handleGateSignIn = async function() {
    document.getElementById('gateMsg').textContent = 'Opening Google sign in…';
    document.getElementById('gateBtn').style.display = 'none';
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
      // onAuthStateChanged will fire and call loadStats
    } catch (err) {
      document.getElementById('gateMsg').textContent =
        'Sign in cancelled or failed. Try again.';
      document.getElementById('gateBtn').style.display = 'block';
    }
  };

  window.handleSignOut = async function() {
    await signOut(auth);
    location.reload();
  };

  window.loadStats = async function(isRefresh) {
    const requestUser = auth.currentUser;
    if (!requestUser) return;
    const dash    = document.getElementById('dashboard');
    const errBan  = document.getElementById('errorBanner');
    const adminHeader = document.getElementById('adminHeader');
    const adminMain   = document.getElementById('adminMain');
    const gate    = document.getElementById('authGate');
    errBan.style.display = 'none';

    if (!isRefresh) {
      dash.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>Loading stats…</div>
        </div>`;
    }

    let token;
    try {
      token = await requestUser.getIdToken();
      if (auth.currentUser !== requestUser) return;
    } catch (err) {
      document.getElementById('gateMsg').textContent =
        'Could not get auth token. Please sign in again.';
      document.getElementById('gateBtn').style.display = 'block';
      gate.style.display = 'flex';
      adminHeader.style.display = 'none';
      adminMain.style.display = 'none';
      return;
    }

    let data;
    try {
      const res = await fetch('/api/admin-stats', {
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (auth.currentUser !== requestUser) return;

      if (res.status === 403) {
        document.getElementById('gateMsg').textContent =
          'This account does not have admin access.';
        document.getElementById('gateBtn').style.display = 'none';
        if (document.getElementById('gateSignOut')) return;
        const out = document.createElement('button');
        out.id = 'gateSignOut';
        out.className = 'gate-btn';
        out.style.background = '#9CA3AF';
        out.style.boxShadow  = '0 4px 0 #6B7280';
        out.style.marginTop  = '12px';
        out.textContent = 'Sign out';
        out.onclick = handleSignOut;
        document.querySelector('.gate-body').appendChild(out);
        return;
      }

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || `HTTP ${res.status}`);
      }
      data = await res.json();
      if (auth.currentUser !== requestUser) return;
    } catch (err) {
      if (auth.currentUser !== requestUser) return;
      gate.style.display = 'none';
      adminHeader.style.display = 'flex';
      adminMain.style.display   = 'block';
      errBan.style.display = 'block';
      errBan.textContent = '❗ ' + (err.message || 'Failed to load stats');
      dash.innerHTML = '';
      // The Comped Knox Plus manager has its own endpoint, so keep it usable.
      if (!document.getElementById('compForm')) renderCompPanel();
      loadComped();
      loadSupport();
      return;
    }

    // Reveal dashboard
    gate.style.display = 'none';
    adminHeader.style.display = 'flex';
    adminMain.style.display   = 'block';

    document.getElementById('lastUpdated').textContent =
      'Updated ' + new Date(data.generatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    renderDashboard(data);
    if (!document.getElementById('compForm')) renderCompPanel();
    loadComped();
    loadSupport();
  };

  // ─── Support inbox ───
  // Conversations from the Knox Support chat in the app (api/_support.js).
  // Ones sent to the team ("Refund request" / "Needs a person") wait here;
  // a reply shows up in the student's Messages tab and is emailed to them.
  const si = { chats: [], id: null, filter: 'waiting' };
  async function supportFetch(body) {
    const user = auth.currentUser;
    if (!user) throw new Error('Please sign in again.');
    const res = await fetch('/api/me?route=support', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + await user.getIdToken(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }
  const siAgo = ms => { const m = (Date.now() - ms) / 60000; return m < 1 ? 'now' : m < 60 ? Math.floor(m) + 'm' : m < 1440 ? Math.floor(m / 60) + 'h' : new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' }); };
  const siTag = c => c.status === 'waiting' ? `<span class="si-tag ${c.kind === 'refund' ? 'refund' : 'waiting'}">${c.kind === 'refund' ? '💸 Refund request' : '🙋 Needs a reply'}</span>`
    : c.status === 'replied' ? '<span class="si-tag replied">Replied</span>' : c.status === 'closed' ? '<span class="si-tag">Closed</span>' : '<span class="si-tag">Knox Support only</span>';
  function renderSupportList() {
    const panel = document.getElementById('supportPanel');
    const waiting = si.chats.filter(c => c.status === 'waiting').length;
    const shown = si.filter === 'waiting' ? si.chats.filter(c => c.status === 'waiting') : si.chats;
    if (!panel.querySelector('.si-wrap')) {
      panel.innerHTML = `<h2 class="section-title">Support inbox <span class="si-count" id="siCount" hidden></span></h2>
        <div class="card si-wrap"><div class="si-list"><div class="si-filter" id="siFilter">
          <button class="trial-tab" data-f="waiting">Needs a reply</button><button class="trial-tab" data-f="all">All</button>
          <button class="trial-tab" data-f="refresh" title="Refresh">↻</button></div><div id="siItems"></div></div>
          <div class="si-view" id="siView"><div class="si-empty">Pick a conversation.</div></div></div>`;
      panel.querySelector('#siFilter').addEventListener('click', e => {
        const f = e.target.closest('button')?.dataset.f; if (!f) return;
        if (f === 'refresh') return loadSupport();
        si.filter = f; renderSupportList();
      });
      panel.querySelector('#siItems').addEventListener('click', e => { const b = e.target.closest('.si-item'); if (b) openSupportChat(b.dataset.id); });
    }
    panel.querySelectorAll('#siFilter [data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === si.filter));
    const count = panel.querySelector('#siCount'); count.hidden = !waiting; count.textContent = waiting;
    panel.querySelector('#siItems').innerHTML = shown.length ? shown.map(c => `
      <button class="si-item${c.id === si.id ? ' on' : ''}${c.teamUnread ? ' new' : ''}" data-id="${escHtml(c.id)}">
        <b><span>${escHtml(c.name || c.email || 'Student')}</span><time>${siAgo(c.updatedAt)}</time></b>
        <p>${escHtml(c.last ? (c.last.from === 'user' ? '' : c.last.from === 'team' ? 'You: ' : 'Knox Support: ') + c.last.text : c.title)}</p>${siTag(c)}
      </button>`).join('') : `<div class="si-empty">${si.filter === 'waiting' ? 'All caught up 🎉' : 'No conversations yet.'}</div>`;
  }
  async function loadSupport() {
    try { si.chats = (await supportFetch({ action: 'admin-list' })).chats || []; }
    catch (err) { document.getElementById('supportPanel').innerHTML = '<h2 class="section-title">Support inbox</h2><div class="card"><div class="comp-empty">Could not load support messages: ' + escHtml(err.message) + '</div></div>'; return; }
    renderSupportList();
    const fromLink = (location.hash.match(/^#support-([\w-]+)/) || [])[1];
    if (fromLink && !si.id) { si.filter = 'all'; renderSupportList(); openSupportChat(fromLink); document.getElementById('supportPanel').scrollIntoView(); }
  }
  const siMsgs = c => c.messages.map(m => `<div class="si-msg ${m.note ? 'note' : m.from}">${m.note ? '' : `<small>${m.from === 'user' ? 'Student' : m.from === 'team' ? 'You (Knox team)' : 'Knox Support (AI)'} · ${new Date(m.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</small>`}${escHtml(m.text)}</div>`).join('');
  // Live updates: the open conversation checks every 5 seconds (keeping your
  // half-written reply), the list every 15.
  let siTicks = 0;
  setInterval(async () => {
    siTicks++;
    if (document.visibilityState !== 'visible' || !auth.currentUser || !document.getElementById('siItems')) return;
    if (siTicks % 3 === 0) {
      try { si.chats = (await supportFetch({ action: 'admin-list' })).chats || si.chats; renderSupportList(); } catch {}
    }
    const id = si.id, thread = document.getElementById('siThread');
    if (!id || !thread) return;
    try {
      const c = (await supportFetch({ action: 'admin-get', id, light: true })).chat;
      if (si.id !== id || c.messages.length === si.count) return;
      si.count = c.messages.length;
      thread.innerHTML = siMsgs(c);
      thread.scrollTop = thread.scrollHeight;
    } catch {}
  }, 5000);
  async function openSupportChat(id) {
    si.id = id; renderSupportList();
    const view = document.getElementById('siView');
    view.innerHTML = '<div class="si-empty">Loading…</div>';
    let r;
    try { r = await supportFetch({ action: 'admin-get', id }); }
    catch (err) { view.innerHTML = '<div class="si-empty">' + escHtml(err.message) + '</div>'; return; }
    const c = r.chat, s = si.chats.find(x => x.id === id); if (s) s.teamUnread = false;
    si.count = c.messages.length;
    view.innerHTML = `<div class="si-head"><div><strong>${escHtml(c.name || c.email || 'Student')}</strong> ${siTag(c)}
        <p class="si-facts">${escHtml(r.account)}\nUser ID: ${escHtml(c.uid)}</p></div>
        ${c.status !== 'closed' ? '<button class="comp-remove" id="siClose" style="color:var(--text-light)">Mark solved</button>' : ''}</div>
      <div class="si-thread" id="siThread">${siMsgs(c)}</div>
      <form class="si-reply" id="siReply"><textarea id="siText" placeholder="Reply to ${escHtml(c.name || 'them')}… (they see it in Knox and get an email)" maxlength="4000"></textarea><button class="comp-btn" type="submit">Send</button></form>`;
    const t = view.querySelector('#siThread'); t.scrollTop = t.scrollHeight;
    renderSupportList();
    view.querySelector('#siReply').addEventListener('submit', async e => {
      e.preventDefault();
      const text = view.querySelector('#siText').value.trim(), btn = e.submitter;
      if (!text) return;
      btn.disabled = true;
      try { await supportFetch({ action: 'admin-reply', id, text }); await loadSupport(); openSupportChat(id); }
      catch (err) { alert(err.message); btn.disabled = false; }
    });
    view.querySelector('#siClose')?.addEventListener('click', async () => {
      try { await supportFetch({ action: 'admin-close', id }); await loadSupport(); openSupportChat(id); } catch (err) { alert(err.message); }
    });
  }

  // ─── Comped Knox Plus manager ───
  async function compFetch(method, body) {
    const user = auth.currentUser;
    if (!user) throw new Error('Please sign in again.');
    const token = await user.getIdToken();
    const res = await fetch('/api/admin-comp', {
      method,
      headers: Object.assign({ 'Authorization': 'Bearer ' + token }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function compMessage(text, ok) {
    const el = document.getElementById('compMsg');
    if (!el) return;
    el.textContent = text;
    el.className = 'comp-msg ' + (ok ? 'ok' : 'err');
  }

  function renderCompPanel() {
    const panel = document.getElementById('compPanel');
    panel.innerHTML = `
      <h2 class="section-title">Comped plans</h2>
      <div class="card card-lg">
        <div class="metric-label">Give someone free Knox Plus or Mega Knox</div>
        <p style="font-size:13px;font-weight:700;color:var(--text-light);margin:6px 0 14px;line-height:1.5;">
          They need a Knox account first. A comped plan works everywhere that plan does and is never charged.
          Knox Ambassadors get Mega Knox. Pick a different plan for someone already comped to change it.
          If they also pay for a plan, removing the comp keeps the plan they pay for.
        </p>
        <form class="comp-form" id="compForm" autocomplete="off">
          <input id="compEmail" type="email" placeholder="their@email.com" required maxlength="254">
          <select id="compTier" aria-label="Plan to give"><option value="plus">⚡ Knox Plus</option><option value="mega">💎 Mega Knox</option><option value="ambassador">🦊 Knox Ambassador (Mega)</option></select>
          <input id="compNote" type="text" placeholder="Note (optional), e.g. beta tester" maxlength="200">
          <button class="comp-btn" id="compSubmit" type="submit">Give free plan</button>
        </form>
        <div class="comp-msg" id="compMsg"></div>
        <div class="comp-list" id="compList"><div class="comp-empty">Loading…</div></div>
      </div>
      <h2 class="section-title">Gift codes</h2>
      <div class="card card-lg">
        <div class="metric-label">Make Knox Plus or Mega Knox gift codes</div>
        <p style="font-size:13px;font-weight:700;color:var(--text-light);margin:6px 0 14px;line-height:1.5;">
          For giveaways and contests. Each code works once and never expires — anyone enters it at knoxknowsapp.com/redeem.
          It's time-limited Knox Plus or Mega Knox, not a subscription.
        </p>
        <form class="comp-form" id="giftForm" autocomplete="off">
          <select id="giftLength" aria-label="Gift"><option value="1m">⚡ Plus · 1 month</option><option value="3m">⚡ Plus · 3 months</option><option value="12m">⚡ Plus · 12 months</option><option value="mega-1m">💎 Mega · 1 month</option><option value="mega-3m">💎 Mega · 3 months</option><option value="mega-12m">💎 Mega · 12 months</option></select>
          <input id="giftCount" type="number" min="1" max="50" value="1" aria-label="How many codes">
          <input id="giftNote" type="text" placeholder="Note (optional), e.g. Discord giveaway" maxlength="200">
          <button class="comp-btn" id="giftSubmit" type="submit">Make codes</button>
        </form>
        <div class="comp-msg" id="giftMsg"></div>
        <textarea id="giftCodes" readonly rows="4" style="display:none;width:100%;margin-top:10px;font-family:monospace;font-size:14px;padding:10px;border-radius:10px;" aria-label="New gift codes"></textarea>
      </div>`;

    document.getElementById('compForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('compSubmit');
      const email = document.getElementById('compEmail').value.trim();
      const note = document.getElementById('compNote').value.trim();
      if (!email) return;
      btn.disabled = true;
      compMessage('', true);
      try {
        const tier = document.getElementById('compTier').value;
        const name = tier === 'plus' ? 'Knox Plus' : tier === 'mega' ? 'Mega Knox' : 'Knox Ambassador (Mega Knox)';
        const r = await compFetch('POST', { action: 'grant', email, note, tier });
        compMessage(r.already ? `${r.email} already has comped ${name}.` : `Gave free ${name} to ${r.email}.`, true);
        document.getElementById('compEmail').value = '';
        document.getElementById('compNote').value = '';
        await loadComped();
      } catch (err) {
        compMessage(err.message, false);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('giftForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('giftSubmit'), msg = document.getElementById('giftMsg'), out = document.getElementById('giftCodes');
      btn.disabled = true; msg.textContent = '';
      try {
        const r = await compFetch('POST', { action: 'gift-codes', gift: document.getElementById('giftLength').value, count: document.getElementById('giftCount').value, note: document.getElementById('giftNote').value.trim() });
        out.value = r.codes.join('\n'); out.style.display = 'block'; out.select();
        msg.textContent = `Made ${r.codes.length} code${r.codes.length === 1 ? '' : 's'} for ${r.label} of Knox Plus — copy them now.`; msg.className = 'comp-msg ok';
      } catch (err) { msg.textContent = err.message; msg.className = 'comp-msg err'; }
      finally { btn.disabled = false; }
    });

    document.getElementById('compList').addEventListener('click', async (e) => {
      const btn = e.target.closest('.comp-remove');
      if (!btn) return;
      const who = btn.dataset.label || 'this user';
      if (!confirm(`Remove free Knox Plus from ${who}?`)) return;
      btn.disabled = true;
      try {
        const r = await compFetch('POST', { action: 'revoke', uid: btn.dataset.uid });
        compMessage(r.result === 'kept-paid'
          ? `Removed the comp from ${who}. They keep Knox Plus because they pay for it.`
          : `Removed free Knox Plus from ${who}.`, true);
        await loadComped();
      } catch (err) {
        compMessage(err.message, false);
        btn.disabled = false;
      }
    });
  }

  async function loadComped() {
    const list = document.getElementById('compList');
    if (!list) return;
    try {
      const { comped } = await compFetch('GET');
      if (!comped.length) {
        list.innerHTML = '<div class="comp-empty">Nobody has Comped Knox Plus yet.</div>';
        return;
      }
      list.innerHTML = comped.map(c => {
        const label = c.email || c.name || c.uid;
        const since = c.compedAt ? new Date(c.compedAt).toLocaleDateString() : '—';
        return `
          <div class="comp-row">
            <div class="comp-who">
              <strong>${escHtml(c.name || c.email || c.uid)}</strong>
              <span>${escHtml(c.name ? (c.email || '') : '')}${c.name && c.email ? ' · ' : ''}since ${escHtml(since)}${c.note ? ' · ' + escHtml(c.note) : ''}</span>
            </div>
            <span class="comp-tag" style="${c.tier === 'mega' ? 'background:#FFF3C4;color:#8A5A00;border-color:#F2B705;' : ''}">${c.ambassador ? '🦊 Ambassador' : c.tier === 'mega' ? '💎 Mega' : '⚡ Plus'}</span>
            ${c.alsoPaying ? '<span class="comp-tag">Also paying</span>' : ''}
            <button class="comp-remove" type="button" data-uid="${escHtml(c.uid)}" data-label="${escHtml(label)}">Remove</button>
          </div>`;
      }).join('');
    } catch (err) {
      list.innerHTML = '<div class="comp-empty">Could not load Comped Knox Plus users: ' + escHtml(err.message) + '</div>';
    }
  }

  function fmt(n) {
    if (n == null) return '—';
    return Number(n).toLocaleString();
  }
  function fmtPct(n) {
    if (n == null) return '—';
    return (Math.round(n * 10) / 10) + '%';
  }
  function fmtMoney(n) {
    if (n == null) return '—';
    return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function escHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function planClass(plan) {
    return ['super', 'max', 'plus'].includes(plan) ? plan : 'free';
  }
  function relTime(ts) {
    if (!ts) return '—';
    const diff = Date.now() - ts;
    const sec  = Math.floor(diff / 1000);
    if (sec < 60)   return sec + 's ago';
    const min = Math.floor(sec / 60);
    if (min < 60)   return min + 'm ago';
    const hr  = Math.floor(min / 60);
    if (hr  < 24)   return hr + 'h ago';
    const dy  = Math.floor(hr / 24);
    if (dy  < 30)   return dy + 'd ago';
    return new Date(ts).toLocaleDateString();
  }

  function renderDashboard(data) {
    const dash = document.getElementById('dashboard');
    const { users, feedback, usage, revenue } = data;

    // ─── REVENUE (if Stripe configured) ───
    let revenueHtml = '';
    if (revenue && !revenue.error) {
      revenueHtml = `
        <h2 class="section-title">Revenue</h2>
        <div class="grid grid-4">
          <div class="metric-card orange">
            <div class="metric-label">MRR</div>
            <div class="metric-value">${escHtml(fmtMoney(revenue.mrr))}</div>
            <div class="metric-sub">Monthly recurring revenue</div>
          </div>
          <div class="metric-card green">
            <div class="metric-label">Active subs</div>
            <div class="metric-value">${fmt(revenue.activeSubscriptions)}</div>
            <div class="metric-sub">Paid &amp; active</div>
          </div>
          <div class="metric-card blue">
            <div class="metric-label">In trial</div>
            <div class="metric-value">${fmt(revenue.trialingSubscriptions)}</div>
            <div class="metric-sub">Free trial period</div>
          </div>
          <div class="metric-card ${revenue.pastDueSubscriptions > 0 ? '' : 'purple'}" ${revenue.pastDueSubscriptions > 0 ? 'style="border-color:#FECACA;box-shadow:0 4px 0 #FECACA;background:linear-gradient(135deg,white,#FEF2F2);"' : ''}>
            <div class="metric-label">Past due</div>
            <div class="metric-value" ${revenue.pastDueSubscriptions > 0 ? 'style="color:var(--red);"' : ''}>${fmt(revenue.pastDueSubscriptions)}</div>
            <div class="metric-sub">Failed payment</div>
          </div>
        </div>
        ${revenue.byPlan && Object.values(revenue.byPlan).some(v => v > 0) ? `
        <div class="card-lg card" style="margin-top:16px;">
          <div class="metric-label">Active subscriptions by plan</div>
          <div style="margin-top:14px;">
            ${revPlanBars(revenue.byPlan)}
          </div>
        </div>` : ''}
      `;
    } else if (revenue && revenue.error) {
      revenueHtml = `
        <h2 class="section-title">Revenue</h2>
        <div class="card-lg card empty-state">
          <span class="empty-state-emoji">💳</span>
          Revenue stats unavailable — ${escHtml(revenue.error)}
        </div>`;
    }

    // ─── FREE TRIALS ───
    const trials = revenue && !revenue.error ? revenue.trials : null;
    lastTrials = trials ? trials.list : [];
    const trialsHtml = trials ? `
      <h2 class="section-title">Free trials</h2>
      <div class="grid grid-4">
        <div class="metric-card blue">
          <div class="metric-label">In trial now</div>
          <div class="metric-value">${fmt(trials.active)}</div>
          <div class="metric-sub">${fmt(trials.cancelling)} already cancelled</div>
        </div>
        <div class="metric-card orange">
          <div class="metric-label">Started this week</div>
          <div class="metric-value">${fmt(trials.startedThisWeek)}</div>
          <div class="metric-sub">${fmt(trials.startedThisMonth)} in the last 30 days</div>
        </div>
        <div class="metric-card green">
          <div class="metric-label">Trial → paid</div>
          <div class="metric-value">${trials.conversionPct == null ? '—' : fmtPct(trials.conversionPct)}</div>
          <div class="metric-sub">${fmt(trials.converted)} of ${fmt(trials.finished)} finished trials paid</div>
        </div>
        <div class="metric-card purple">
          <div class="metric-label">All-time trials</div>
          <div class="metric-value">${fmt(trials.list.length)}</div>
          <div class="metric-sub">Every Knox Plus trial started</div>
        </div>
      </div>
      <div class="card-lg card" style="margin-top:16px;">
        <div class="trial-head">
          <div class="metric-label" style="margin:0;">Trial sign-ups</div>
          <div class="trial-tabs" id="trialTabs">
            ${TRIAL_FILTERS.map(([key, label]) => `<button type="button" class="trial-tab${key === trialFilter ? ' on' : ''}" data-filter="${key}">${label} · ${fmt(lastTrials.filter(TRIAL_MATCH[key]).length)}</button>`).join('')}
          </div>
        </div>
        <div class="data-list" id="trialList" style="margin-top:14px;">${trialListHtml()}</div>
      </div>
    ` : '';

    // ─── USERS ───
    const maxSignup = Math.max(1, ...users.signupSeries.map(d => d.count));
    const usersHtml = `
      <h2 class="section-title">Users &amp; growth</h2>
      <div class="grid grid-4">
        <div class="metric-card orange">
          <div class="metric-label">Total users</div>
          <div class="metric-value">${fmt(users.total)}</div>
          <div class="metric-sub">All-time signups</div>
        </div>
        <div class="metric-card green">
          <div class="metric-label">New today</div>
          <div class="metric-value">${fmt(users.newToday)}</div>
          <div class="metric-sub">${fmt(users.newThisWeek)} this week</div>
        </div>
        <div class="metric-card blue">
          <div class="metric-label">Active today</div>
          <div class="metric-value">${fmt(users.activeToday)}</div>
          <div class="metric-sub">${fmt(users.activeThisWeek)} this week (WAU)</div>
        </div>
        <div class="metric-card purple">
          <div class="metric-label">Conversion</div>
          <div class="metric-value">${fmtPct(users.conversionPct)}</div>
          <div class="metric-sub">${fmt(users.paying)} paying users (trials not counted)</div>
        </div>
      </div>

      <div class="grid grid-2" style="margin-top:16px;">
        <div class="card-lg card">
          <div class="metric-label">Signups, last 14 days</div>
          <div class="spark-wrap">
            ${users.signupSeries.map(d => `
              <div class="spark-bar" data-tooltip="${escHtml(d.date)} · ${d.count} new"
                   style="height:${Math.max(2, (d.count / maxSignup) * 100)}%;"></div>
            `).join('')}
          </div>
          <div class="spark-x-labels">
            ${users.signupSeries.map((d, i) => {
              // d.date is a UTC day; getDate() would show the day before west of UTC.
              const day = new Date(d.date).getUTCDate();
              return `<div class="spark-x-label">${(i % 2 === 0) ? day : ''}</div>`;
            }).join('')}
          </div>
        </div>
        <div class="card-lg card">
          <div class="metric-label">Plan distribution</div>
          <div style="margin-top:14px;">
            ${planBar('Free',      users.byPlan.free, users.total, 'orange')}
            ${planBar('⚡ Knox Plus (paying)', users.byPlan.super || 0, users.total, 'green')}
            ${planBar('💎 Mega Knox (paying)', users.byPlan.max || 0, users.total, 'orange')}
            ${planBar('Free trial (Mega Knox)', users.byPlan.trial || 0, users.total, 'purple')}
            ${planBar('Comped Knox Plus', users.byPlan.comped || 0, users.total, 'blue')}
            ${planBar('Comped Mega Knox' + (users.byPlan.ambassadors ? ` (${users.byPlan.ambassadors} Ambassador${users.byPlan.ambassadors === 1 ? '' : 's'})` : ''), users.byPlan.compedMega || 0, users.total, 'blue')}
          </div>
        </div>
      </div>
    `;

    // ─── FEEDBACK ───
    const score        = feedback.positivePct;
    const ringCirc     = 2 * Math.PI * 54;        // r=54
    const ringFill     = ringCirc * (1 - score/100);
    const ringColor    = score >= 80 ? 'var(--green)'
                       : score >= 60 ? 'var(--orange)'
                       : 'var(--red)';
    const feedbackHtml = `
      <h2 class="section-title">Feedback &amp; quality</h2>
      <div class="grid grid-2">
        <div class="card-lg card">
          <div class="metric-label">Overall satisfaction</div>
          <div class="score-ring-wrap" style="margin-top:14px;">
            <div class="score-ring">
              <svg viewBox="0 0 120 120">
                <circle class="score-ring-bg"   cx="60" cy="60" r="54"></circle>
                <circle class="score-ring-fill" cx="60" cy="60" r="54"
                  style="stroke:${ringColor};stroke-dasharray:${ringCirc};stroke-dashoffset:${ringFill};"></circle>
              </svg>
              <div class="score-ring-text">
                <span class="score-ring-pct">${fmtPct(score)}</span>
                <span class="score-ring-label">Positive</span>
              </div>
            </div>
            <div class="score-summary">
              <div class="score-stat">
                <span class="score-stat-label">👍 Total up</span>
                <span class="score-stat-value up">${fmt(feedback.up)}</span>
              </div>
              <div class="score-stat">
                <span class="score-stat-label">👎 Total down</span>
                <span class="score-stat-value down">${fmt(feedback.down)}</span>
              </div>
              <div class="score-stat">
                <span class="score-stat-label">Today</span>
                <span class="score-stat-value">${fmt(feedback.upToday)} 👍 / ${fmt(feedback.downToday)} 👎</span>
              </div>
              <div class="score-stat">
                <span class="score-stat-label">This week</span>
                <span class="score-stat-value">${fmt(feedback.upWeek)} 👍 / ${fmt(feedback.downWeek)} 👎</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card-lg card">
          <div class="metric-label">Satisfaction by plan</div>
          <div style="margin-top:14px;">
            ${modeBar('Free',      feedback.byPlan.free, 'orange')}
            ${modeBar('Knox Plus', {
              up:   (feedback.byPlan.super?.up   || 0) + (feedback.byPlan.max?.up   || 0) + (feedback.byPlan.plus?.up   || 0),
              down: (feedback.byPlan.super?.down || 0) + (feedback.byPlan.max?.down || 0) + (feedback.byPlan.plus?.down || 0),
            }, 'green')}
          </div>
        </div>
      </div>

      <div class="grid grid-2" style="margin-top:16px;">
        <div class="card-lg card">
          <div class="metric-label">👎 Worst-rated answers (fix these prompts)</div>
          <div class="data-list" style="margin-top:14px;">
            ${feedback.worstAnswers.length === 0
              ? `<div class="empty-state"><span class="empty-state-emoji">🎉</span>No negative feedback yet — Knox is doing great.</div>`
              : feedback.worstAnswers.map(f => `
                <div class="data-row">
                  <div class="data-row-header">
                    <span class="tag tag-down">👎 Down</span>
                    <span class="tag tag-plan-${planClass(f.plan)}">${escHtml((f.plan || 'free').toUpperCase())}</span>
                    ${f.mode === 'learn' ? '<span class="tag" style="background:#F3E8FF;color:#7C3AED;">🎓 Learn</span>' : ''}
                    <span style="font-size:11px;font-weight:700;color:var(--text-light);margin-left:auto;">${relTime(f.ts)}</span>
                  </div>
                  <div class="row-question">${escHtml(f.question || '—')}</div>
                  <div class="row-answer">${escHtml(f.answer || '')}</div>
                </div>
              `).join('')}
          </div>
        </div>
        <div class="card-lg card">
          <div class="metric-label">Recent feedback activity</div>
          <div class="data-list" style="margin-top:14px;">
            ${feedback.recentFeedback.length === 0
              ? `<div class="empty-state"><span class="empty-state-emoji">📭</span>No feedback yet.</div>`
              : feedback.recentFeedback.map(f => `
                <div class="data-row">
                  <div class="data-row-header">
                    <span class="tag ${f.rating === 1 ? 'tag-up' : 'tag-down'}">${f.rating === 1 ? '👍' : '👎'}</span>
                    <span class="tag tag-plan-${planClass(f.plan)}">${escHtml((f.plan || 'free').toUpperCase())}</span>
                    ${f.mode === 'learn' ? '<span class="tag" style="background:#F3E8FF;color:#7C3AED;">🎓 Learn</span>' : ''}
                    <span style="font-size:11px;font-weight:700;color:var(--text-light);margin-left:auto;">${relTime(f.ts)}</span>
                  </div>
                  <div class="row-question">${escHtml(f.question || '—')}</div>
                </div>
              `).join('')}
          </div>
        </div>
      </div>
    `;

    // ─── USAGE ───
    const usageHtml = `
      <h2 class="section-title">Today's usage</h2>
      <div class="grid grid-4">
        <div class="metric-card orange">
          <div class="metric-label">Questions today</div>
          <div class="metric-value">${fmt(usage.questionsToday)}</div>
          <div class="metric-sub">Across all users</div>
        </div>
        <div class="metric-card blue">
          <div class="metric-label">Active askers</div>
          <div class="metric-value">${fmt(usage.usersWithActivityToday)}</div>
          <div class="metric-sub">Asked ≥1 question today</div>
        </div>
        <div class="metric-card green">
          <div class="metric-label">Avg per user</div>
          <div class="metric-value">${fmt(usage.avgQuestionsPerActiveUser)}</div>
          <div class="metric-sub">Questions per active user</div>
        </div>
        <div class="metric-card purple">
          <div class="metric-label">This week</div>
          <div class="metric-value">${fmt(usage.questionsThisWeek)}</div>
          <div class="metric-sub">Questions, last 7 days</div>
        </div>
      </div>
    `;

    // ─── GIFT CODES (one-time payments — not part of MRR) ───
    const g = data.gifts;
    const giftsHtml = g ? `
        <h2 class="section-title">🎁 Gift codes</h2>
        <div class="grid grid-4">
          <div class="metric-card orange"><div class="metric-label">Gifts sold</div><div class="metric-value">${fmt(g.sold)}</div><div class="metric-sub">${fmt(g.soldRedeemed)} redeemed${g.refunded ? ' · ' + fmt(g.refunded) + ' refunded' : ''}</div></div>
          <div class="metric-card green"><div class="metric-label">Gift sales</div><div class="metric-value">${escHtml(fmtMoney(g.soldCents / 100))}</div><div class="metric-sub">One-time, before Stripe fees</div></div>
          <div class="metric-card blue"><div class="metric-label">Codes you made</div><div class="metric-value">${fmt(g.made)}</div><div class="metric-sub">${fmt(g.madeRedeemed)} redeemed</div></div>
          <div class="metric-card purple"><div class="metric-label">Flame Fest gifts</div><div class="metric-value">${fmt(g.flameFest)}</div><div class="metric-sub">${fmt(g.flameFestRedeemed)} redeemed</div></div>
        </div>` : '';
    dash.innerHTML = revenueHtml + giftsHtml + trialsHtml + usersHtml + feedbackHtml + usageHtml;

    const tabs = document.getElementById('trialTabs');
    if (tabs) tabs.addEventListener('click', e => {
      const btn = e.target.closest('.trial-tab');
      if (!btn) return;
      trialFilter = btn.dataset.filter;
      tabs.querySelectorAll('.trial-tab').forEach(b => b.classList.toggle('on', b === btn));
      document.getElementById('trialList').innerHTML = trialListHtml();
    });
  }

  // ─── Free trial list ───
  let lastTrials = [];
  let trialFilter = 'all';
  const TRIAL_FILTERS = [['all', 'All'], ['active', 'In trial'], ['paid', 'Paid'], ['lost', 'Didn\'t pay']];
  const TRIAL_MATCH = {
    all:    () => true,
    active: t => t.outcome === 'trialing' || t.outcome === 'cancelling',
    paid:   t => t.outcome === 'converted' || t.outcome === 'paid_then_cancelled',
    lost:   t => t.outcome === 'cancelled' || t.outcome === 'payment_failed',
  };
  const TRIAL_OUTCOME = {
    trialing:            ['In trial',             'tag-trialing'],
    cancelling:          ['Cancelled · in trial', 'tag-cancelling'],
    converted:           ['Paying',               'tag-converted'],
    paid_then_cancelled: ['Paid, then cancelled', 'tag-cancelled'],
    cancelled:           ['Cancelled in trial',   'tag-cancelled'],
    payment_failed:      ['Payment failed',       'tag-failed'],
  };

  function fmtDateTime(ms) {
    return new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function fmtDate(ms) {
    return new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function trialListHtml() {
    const rows = lastTrials.filter(TRIAL_MATCH[trialFilter]);
    if (!rows.length) {
      return `<div class="empty-state"><span class="empty-state-emoji">🎟️</span>${lastTrials.length ? 'No trials in this group.' : 'Nobody has started a free trial yet.'}</div>`;
    }
    const now = Date.now();
    return rows.map(t => {
      const [label, cls] = TRIAL_OUTCOME[t.outcome] || [t.outcome, 'tag-cancelled'];
      const inTrial = t.outcome === 'trialing' || t.outcome === 'cancelling';
      const daysLeft = t.trialEnd ? Math.max(0, Math.ceil((t.trialEnd - now) / 86400000)) : null;
      const endLine = !t.trialEnd ? ''
        : inTrial ? `${t.outcome === 'cancelling' ? 'Ends' : 'Charges'} <b>${escHtml(fmtDate(t.trialEnd))}</b> (${daysLeft === 0 ? 'today' : daysLeft + (daysLeft === 1 ? ' day' : ' days') + ' left'})`
        : `Trial ended ${escHtml(fmtDate(t.trialEnd))}`;
      return `
        <div class="data-row trial-row">
          <div class="trial-who">
            <strong>${escHtml(t.name || t.email || 'Unknown customer')}</strong>
            <span>${escHtml(t.name ? (t.email || '') : (t.uid ? 'Knox ID ' + t.uid : t.id))}</span>
          </div>
          <span class="tag ${cls}">${escHtml(label)}</span>
          <div class="trial-dates">
            Started <b>${escHtml(fmtDateTime(t.trialStart))}</b> · ${escHtml(relTime(t.trialStart))}<br>
            ${endLine}
          </div>
        </div>`;
    }).join('');
  }

  // ─── Render helpers ───
  function planBar(label, count, total, color) {
    const pct = total > 0 ? (count / total) * 100 : 0;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span>${escHtml(label)}</span>
          <span class="bar-label-value">${fmt(count)} · ${fmtPct(pct)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill ${color}" style="width:${pct}%;"></div>
        </div>
      </div>`;
  }

  function modeBar(label, stats, color) {
    const total = stats.up + stats.down;
    const pct   = total > 0 ? (stats.up / total) * 100 : 0;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span>${escHtml(label)}</span>
          <span class="bar-label-value">${fmt(stats.up)} 👍 / ${fmt(stats.down)} 👎 · ${total > 0 ? fmtPct(pct) : '—'}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill ${color}" style="width:${pct}%;"></div>
        </div>
      </div>`;
  }

  function revPlanBars(byPlan) {
    // Even though we now market one plan (Knox Plus), existing customers
    // still pay via their original price IDs (super_monthly / super_yearly
    // for anyone who signed up when it was called Super, max_* for legacy
    // Max buyers). Merge by billing cadence rather than by legacy tier
    // name so the chart tells us what actually matters — monthly vs yearly
    // revenue split.
    // super_* = Knox Plus, max_* = Mega Knox (including the old Max prices).
    const items = [
      ['⚡ Knox Plus Monthly', byPlan.super_monthly || 0, 'green'],
      ['⚡ Knox Plus Yearly',  byPlan.super_yearly  || 0, 'green'],
      ['💎 Mega Knox Monthly', byPlan.max_monthly   || 0, 'orange'],
      ['💎 Mega Knox Yearly',  byPlan.max_yearly    || 0, 'orange'],
    ];
    const total = items.reduce((s, [, n]) => s + n, 0) || 1;
    return items.map(([label, n, c]) => `
      <div class="bar-row">
        <div class="bar-label">
          <span>${escHtml(label)}</span>
          <span class="bar-label-value">${fmt(n)} · ${fmtPct((n / total) * 100)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill ${c}" style="width:${(n / total) * 100}%;"></div>
        </div>
      </div>
    `).join('');
  }
</script>

</body>
</html>
