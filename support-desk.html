<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Knox Support Desk</title>
<link rel="icon" href="/knox-logo-square.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!-- Knox Support Desk: where the Knox team answers students who wrote to
     Knox Support (the chat button in the app). Server: api/_support-desk.js. -->
<style>
  :root {
    --orange: #FF6B00; --orange-dark: #CC5500; --orange-light: #FFE0C2; --orange-cream: #FFF8F0;
    --green: #58CC02; --green-dark: #46A302; --green-light: #D7FFB8;
    --blue: #1CB0F6; --blue-dark: #0A85C2; --blue-light: #D7F2FD;
    --red: #FF4B4B; --red-light: #FEE2E2; --yellow-light: #FFF6C7; --yellow-dark: #8A6A00;
    --purple: #CE82FF; --purple-light: #F3E8FF;
    --bg: #F7F4F0; --surface: #FFFFFF; --soft: #FAF7F3; --border: #E8E2DA; --text: #3C3C3C; --text-light: #7A746D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --orange-light: #4A2A0E; --orange-cream: #241C14; --green-light: #1F3A0B; --blue-light: #0E3A4E; --red-light: #3E1616;
      --yellow-light: #3A3010; --yellow-dark: #F2CE5C; --purple-light: #2E1450;
      --bg: #14121A; --surface: #1D1A24; --soft: #22202B; --border: #33303D; --text: #EDEAF2; --text-light: #A39FAE;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Nunito', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-weight: 600; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--orange); }
  [hidden] { display: none !important; }

  /* Sign in */
  #gate { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .gate-card { width: min(400px, 100%); background: var(--surface); border: 2px solid var(--border); border-radius: 24px; padding: 30px 28px; box-shadow: 0 5px 0 var(--border); text-align: center; }
  .gate-card img { width: 64px; height: 64px; border-radius: 18px; }
  .gate-card h1 { margin: 12px 0 4px; font-size: 24px; font-weight: 900; }
  .gate-card p { margin: 0 0 18px; color: var(--text-light); font-size: 14.5px; line-height: 1.5; }
  .gate-card form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .gate-or { margin: 16px 0 2px; font-size: 12px; font-weight: 900; color: var(--text-light); text-transform: uppercase; letter-spacing: .08em; }
  .gate-msg { margin-top: 12px; font-size: 13.5px; font-weight: 800; color: var(--red); min-height: 18px; }
  .field { width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); font-weight: 700; outline: none; }
  .field:focus { border-color: var(--orange); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border: none; border-radius: 12px; background: var(--orange); color: #fff; font-weight: 900; font-size: 14px; box-shadow: 0 3px 0 var(--orange-dark); white-space: nowrap; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--orange-dark); }
  .btn:disabled { opacity: .55; cursor: default; transform: none; }
  .btn.ghost { background: var(--surface); color: var(--text); border: 2px solid var(--border); box-shadow: 0 2px 0 var(--border); padding: 8px 14px; }
  .btn.green { background: var(--green); box-shadow: 0 3px 0 var(--green-dark); }
  .btn.red { background: var(--red); box-shadow: 0 3px 0 #C93636; }
  .btn.small { padding: 6px 11px; font-size: 12.5px; border-radius: 10px; }
  .btn.wide { width: 100%; }

  /* App frame */
  #desk { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--orange); color: #fff; border-bottom: 4px solid var(--orange-dark); }
  .top img { width: 36px; height: 36px; border-radius: 10px; border: 2px solid rgba(255,255,255,.8); }
  .top h1 { margin: 0; font-size: 18px; font-weight: 900; }
  .top h1 span { font-weight: 800; opacity: .8; font-size: 13px; margin-left: 6px; }
  .top .sp { flex: 1; }
  .top-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 2px solid rgba(255,255,255,.45); border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; font-weight: 800; font-size: 13px; text-decoration: none; }
  .top-btn:hover { background: rgba(255,255,255,.26); }
  .who { font-size: 13px; font-weight: 800; opacity: .95; }
  .who b { font-weight: 900; }
  .main { display: grid; grid-template-columns: 210px 340px 1fr; min-height: 0; }

  /* Folders */
  .folders { border-right: 2px solid var(--border); background: var(--surface); padding: 14px 10px; overflow-y: auto; }
  .folders h3 { margin: 16px 10px 6px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--text-light); }
  .folders h3:first-child { margin-top: 2px; }
  .folder { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 10px; border: none; border-radius: 10px; background: transparent; text-align: left; font-weight: 800; font-size: 14px; }
  .folder:hover { background: var(--soft); }
  .folder.on { background: var(--orange-light); color: var(--orange-dark); }
  .folder .n { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--soft); font-size: 12px; font-weight: 900; text-align: center; color: var(--text-light); }
  .folder.hot .n { background: var(--red); color: #fff; }

  /* List */
  .list { border-right: 2px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .list-head { padding: 12px; border-bottom: 2px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .list-head h2 { margin: 0 2px; font-size: 17px; font-weight: 900; }
  .items { flex: 1; overflow-y: auto; }
  .item { display: block; width: 100%; text-align: left; padding: 12px 14px; border: none; border-bottom: 1.5px solid var(--border); background: transparent; position: relative; }
  .item:hover { background: var(--soft); }
  .item.on { background: var(--orange-cream); box-shadow: inset 4px 0 0 var(--orange); }
  .item-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item-top b { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.new .item-top b::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: 2px; }
  .item time { font-size: 11.5px; font-weight: 800; color: var(--text-light); flex-shrink: 0; }
  .item p { margin: 3px 0 6px; font-size: 13px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 7px; font-size: 11px; font-weight: 900; background: var(--soft); color: var(--text-light); white-space: nowrap; }
  .tag.waiting { background: var(--orange-light); color: var(--orange-dark); }
  .tag.refund { background: var(--red-light); color: var(--red); }
  .tag.replied { background: var(--blue-light); color: var(--blue-dark); }
  .tag.closed { background: var(--green-light); color: var(--green-dark); }
  .tag.ok { background: var(--green-light); color: var(--green-dark); }
  .tag.mine { background: var(--purple-light); color: #7C3AED; }
  .empty { padding: 40px 24px; text-align: center; color: var(--text-light); font-weight: 800; font-size: 14px; line-height: 1.5; }

  /* Conversation */
  .view { display: grid; grid-template-columns: 1fr 300px; min-height: 0; min-width: 0; }
  .conv { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .conv-head { padding: 12px 18px; background: var(--surface); border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conv-head .t { flex: 1; min-width: 180px; }
  .conv-head .t b { display: block; font-size: 16px; font-weight: 900; }
  .conv-head .t span { font-size: 12.5px; color: var(--text-light); font-weight: 700; }
  .conv-head select { padding: 7px 10px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); font-weight: 800; font-size: 13px; }
  .thread { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 76%; }
  .msg small { display: block; font-size: 11px; font-weight: 900; color: var(--text-light); margin: 0 4px 3px; }
  .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 2px solid var(--border); }
  .msg.user { align-self: flex-start; }
  .msg.user .bubble { border-top-left-radius: 5px; }
  .msg.knox, .msg.team { align-self: flex-end; text-align: left; }
  .msg.knox small, .msg.team small { text-align: right; }
  .msg.knox .bubble { background: var(--soft); border-style: dashed; border-top-right-radius: 5px; }
  .msg.team .bubble { background: var(--orange); border-color: var(--orange); color: #fff; border-top-right-radius: 5px; }
  .sys { align-self: center; max-width: 86%; padding: 6px 12px; border-radius: 10px; background: var(--soft); color: var(--text-light); font-size: 12.5px; font-weight: 800; text-align: center; }
  .note { align-self: stretch; padding: 10px 14px; border-radius: 12px; background: var(--yellow-light); border: 2px dashed #F2CE5C; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note small { display: block; font-size: 11px; font-weight: 900; color: var(--yellow-dark); margin-bottom: 2px; }
  .composer { background: var(--surface); border-top: 2px solid var(--border); padding: 10px 14px 12px; }
  .modes { display: flex; gap: 4px; margin-bottom: 8px; align-items: center; }
  .mode { padding: 6px 12px; border-radius: 9px; border: none; background: transparent; font-weight: 900; font-size: 13px; color: var(--text-light); }
  .mode.on { background: var(--orange-light); color: var(--orange-dark); }
  .mode.on[data-mode="note"] { background: var(--yellow-light); color: var(--yellow-dark); }
  .modes select { margin-left: auto; padding: 6px 10px; border-radius: 9px; border: 2px solid var(--border); background: var(--surface); font-weight: 800; font-size: 12.5px; max-width: 220px; }
  .composer textarea { width: 100%; min-height: 84px; max-height: 260px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); outline: none; line-height: 1.45; }
  .composer textarea:focus { border-color: var(--orange); }
  .composer.note-mode textarea { background: var(--yellow-light); border-color: #F2CE5C; }
  .send-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .send-row .hint { margin-right: auto; font-size: 12px; color: var(--text-light); font-weight: 700; }
  .closed-bar { padding: 12px 16px; background: var(--green-light); color: var(--green-dark); font-weight: 900; font-size: 13.5px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* Side details */
  .side { border-left: 2px solid var(--border); background: var(--surface); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .side h4 { margin: 0 0 8px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--text-light); }
  .facts { margin: 0; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .facts .inside { color: var(--green-dark); font-weight: 900; }
  .facts .passed { color: var(--red); font-weight: 900; }
  .mini { display: flex; flex-direction: column; gap: 6px; }
  .mini button { text-align: left; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--border); background: var(--soft); font-size: 13px; font-weight: 800; }
  .mini button span { display: block; font-size: 11.5px; color: var(--text-light); }
  .charge { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 2px solid var(--border); border-radius: 10px; font-size: 13px; }
  .charge div { flex: 1; min-width: 0; }
  .charge b { display: block; font-weight: 900; }
  .charge span { font-size: 11.5px; color: var(--text-light); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; margin: 8px 0 0; }
  .check input { width: 16px; height: 16px; accent-color: var(--orange); }

  /* Pages (team, saved replies, guide, settings) */
  .page { grid-column: 2 / -1; overflow-y: auto; padding: 24px; }
  .page-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .page h2 { margin: 0; font-size: 22px; font-weight: 900; }
  .page .lead { margin: 0; color: var(--text-light); font-size: 14.5px; line-height: 1.55; }
  .card { background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: 0 3px 0 var(--border); }
  .card h3 { margin: 0 0 10px; font-size: 16px; font-weight: 900; }
  .row-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row-form .field { flex: 1 1 180px; }
  .person { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1.5px solid var(--border); flex-wrap: wrap; }
  .person:last-child { border-bottom: none; }
  .person .pi { flex: 1; min-width: 160px; }
  .person .pi b { display: block; font-weight: 900; }
  .person .pi span { font-size: 12.5px; color: var(--text-light); }
  .reply-edit { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1.5px solid var(--border); }
  .reply-edit textarea { min-height: 70px; resize: vertical; }
  .guide h3 { margin-top: 4px; }
  .guide ul { margin: 0; padding-left: 20px; line-height: 1.7; font-size: 14.5px; }
  .guide li b { font-weight: 900; }
  .ok-msg { font-size: 13px; font-weight: 800; color: var(--green-dark); min-height: 18px; }
  .err-msg { font-size: 13px; font-weight: 800; color: var(--red); min-height: 18px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 12px; background: #2B2830; color: #fff; font-weight: 800; font-size: 14px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.25); }

  @media (max-width: 1250px) { .view { grid-template-columns: 1fr; } .side { border-left: none; border-top: 2px solid var(--border); } .conv { min-height: 70vh; } .view { overflow-y: auto; } }
  @media (max-width: 980px) {
    .main { grid-template-columns: 1fr; }
    .folders { display: flex; gap: 6px; overflow-x: auto; padding: 8px; border-right: none; border-bottom: 2px solid var(--border); }
    .folders h3 { display: none; }
    .folder { width: auto; white-space: nowrap; }
    .main.has-chat .list { display: none; }
    .main:not(.has-chat) .view { display: none; }
    .page { grid-column: 1; }
    .back-btn { display: inline-flex !important; }
    .top h1 span, .who { display: none; }
  }
  .back-btn { display: none !important; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <img src="/knox-logo-square.jpg" alt="">
    <h1>Knox Support Desk</h1>
    <p id="gateText">For the Knox support team. Sign in with the account Sion added to the team.</p>
    <div id="gateForms">
      <button class="btn wide" id="googleBtn" type="button">Sign in with Google</button>
      <div class="gate-or">or</div>
      <form id="emailForm">
        <input class="field" id="gEmail" type="email" placeholder="Email" autocomplete="username" required>
        <input class="field" id="gPass" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn ghost wide" type="submit">Sign in with email</button>
      </form>
    </div>
    <button class="btn ghost wide" id="gateOut" type="button" hidden>Sign out</button>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<div id="desk" hidden>
  <header class="top">
    <img src="/knox-logo-square.jpg" alt="">
    <h1>Support Desk <span>Knox Knows</span></h1>
    <span class="sp"></span>
    <span class="who" id="whoAmI"></span>
    <button class="top-btn" id="alertsBtn" type="button" title="Sound + desktop alert for new messages">🔔 Alerts off</button>
    <button class="top-btn" id="signOutBtn" type="button">Sign out</button>
  </header>
  <div class="main" id="main">
    <nav class="folders" id="folders" aria-label="Folders"></nav>
    <section class="list" id="listPane">
      <div class="list-head">
        <h2 id="listTitle">Needs a reply</h2>
        <p id="emailDeliveryWarning" hidden role="status" style="font-size:13px;margin:8px 0"></p>
        <input class="field" id="search" type="search" placeholder="Search name, email or message" autocomplete="off">
      </div>
      <div class="items" id="items"><div class="empty">Loading…</div></div>
    </section>
    <section class="view" id="view"><div class="conv"><div class="empty" style="margin:auto">Pick a conversation.</div></div></section>
    <section class="page" id="page" hidden></section>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyAlu0ARxOD4kmtRSuEoVJaqCDh4lr4_h9E",
    authDomain:        "knox-knows.firebaseapp.com",
    projectId:         "knox-knows",
    storageBucket:     "knox-knows.firebasestorage.app",
    messagingSenderId: "217543758511",
    appId:             "1:217543758511:web:f5451b30eea1918caa3a5a",
  };
  const auth = getAuth(initializeApp(firebaseConfig));
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ago = ms => { const m = (Date.now() - ms) / 60000; return m < 1 ? 'now' : m < 60 ? Math.floor(m) + 'm' : m < 1440 ? Math.floor(m / 60) + 'h' : m < 10080 ? Math.floor(m / 1440) + 'd' : new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' }); };
  const when = ms => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const toast = t => { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); };

  let authEpoch = 0;
  async function api(body) {
    const u = auth.currentUser, epoch = authEpoch;
    if (!u) throw new Error('Please sign in again.');
    const guard = () => { if (epoch !== authEpoch || auth.currentUser?.uid !== u.uid) throw Object.assign(new Error('Account changed. Please sign in again.'), { stale: true }); };
    const token = await u.getIdToken(); guard();
    const r = await fetch('/api/me?route=support', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    guard();
    if (!r.ok) { const e = new Error(data.error || 'Something went wrong.'); e.status = r.status; throw e; }
    return data;
  }

  // ── State ──
  const S = { me: null, replies: [], chats: [], folder: 'needs', q: '', id: null, chat: null, extra: null, mode: 'reply', page: null, team: [], charges: null, alerts: false, seenWaiting: null };
  try { S.alerts = localStorage.getItem('knoxDeskAlerts') === 'on' && 'Notification' in window && Notification.permission === 'granted'; } catch {}

  // ── Sign in ──
  $('googleBtn').onclick = async () => { $('gateMsg').textContent = ''; try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { if (e.code !== 'auth/popup-closed-by-user') $('gateMsg').textContent = 'Sign in failed. Try again.'; } };
  $('emailForm').onsubmit = async e => { e.preventDefault(); $('gateMsg').textContent = ''; try { await signInWithEmailAndPassword(auth, $('gEmail').value.trim(), $('gPass').value); } catch { $('gateMsg').textContent = 'Wrong email or password.'; } };
  $('gateOut').onclick = $('signOutBtn').onclick = () => signOut(auth).then(() => location.reload());

  onAuthStateChanged(auth, async user => {
    const epoch = ++authEpoch;
    Object.assign(S, { me: null, replies: [], chats: [], id: null, chat: null, extra: null, charges: null, team: [], seenWaiting: null });
    $('view').replaceChildren(); $('items').replaceChildren(); $('folders').replaceChildren(); $('page').replaceChildren();
    $('desk').hidden = true; $('gate').hidden = false;
    $('gateForms').hidden = !!user; $('gateOut').hidden = !user;
    if (!user) { $('gateText').textContent = 'For the Knox support team. Sign in with the account Sion added to the team.'; return; }
    $('gateText').textContent = 'Checking your access…';
    try {
      const r = await api({ action: 'desk-me' });
      if (epoch !== authEpoch || auth.currentUser?.uid !== user.uid) return;
      S.me = r.me; S.replies = r.replies || [];
    } catch (e) {
      if (e.stale || epoch !== authEpoch) return;
      $('gateText').textContent = e.status === 403 ? `${user.email} isn't on the Knox support team yet. Ask Sion to add you.` : e.message;
      return;
    }
    $('gate').hidden = true; $('desk').hidden = false;
    $('whoAmI').innerHTML = `<b>${esc(S.me.name)}</b> · ${S.me.role === 'owner' ? 'Owner' : 'Support team'}`;
    syncAlertsBtn();
    renderFolders();
    await Promise.all([loadList(), loadTeam()]);
    if (epoch !== authEpoch || auth.currentUser?.uid !== user.uid) return;
    const fromLink = (location.hash.match(/^#c-([\w-]+)/) || [])[1];
    if (fromLink) { S.folder = 'all'; renderFolders(); renderList(); openChat(fromLink); }
  });

  // ── Folders ──
  const FOLDERS = [
    ['needs', '📥', 'Needs a reply', c => c.status === 'waiting'],
    ['mine', '🙋', 'Mine', c => c.assignedTo?.uid === S.me?.uid && c.status !== 'closed'],
    ['unassigned', '🫥', 'Unassigned', c => c.status === 'waiting' && !c.assignedTo],
    ['refunds', '💸', 'Refund requests', c => c.kind === 'refund' && c.status !== 'closed'],
    ['replied', '💬', 'Waiting on student', c => c.status === 'replied'],
    ['bot', '🦊', 'Knox Support only', c => !c.kind && c.status === 'open'],
    ['closed', '✅', 'Solved', c => c.status === 'closed'],
    ['all', '🗂️', 'All', () => true],
  ];
  function renderFolders() {
    const count = f => S.chats.filter(f).length;
    let html = '<h3>Inbox</h3>' + FOLDERS.map(([k, icon, label, f]) => {
      const n = count(f), hot = (k === 'needs' || k === 'mine' || k === 'refunds') && n > 0;
      return `<button class="folder${S.folder === k && !S.page ? ' on' : ''}${hot ? ' hot' : ''}" data-folder="${k}"><span>${icon}</span>${label}${k === 'all' || k === 'closed' || k === 'bot' ? '' : `<span class="n">${n}</span>`}</button>`;
    }).join('');
    html += '<h3>Team</h3>';
    if (S.me?.role === 'owner') html += `<button class="folder${S.page === 'team' ? ' on' : ''}" data-page="team"><span>👥</span>Team</button>`;
    html += `<button class="folder${S.page === 'replies' ? ' on' : ''}" data-page="replies"><span>⚡</span>Saved replies</button>
      <button class="folder${S.page === 'guide' ? ' on' : ''}" data-page="guide"><span>📘</span>How we help</button>
      <button class="folder${S.page === 'settings' ? ' on' : ''}" data-page="settings"><span>⚙️</span>My settings</button>`;
    $('folders').innerHTML = html;
    const waiting = count(FOLDERS[0][3]);
    document.title = (waiting ? `(${waiting}) ` : '') + 'Knox Support Desk';
  }
  $('folders').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.folder) { S.folder = b.dataset.folder; S.page = null; showPage(null); renderFolders(); renderList(); }
    if (b.dataset.page) { S.page = b.dataset.page; renderFolders(); showPage(S.page); }
  };

  // ── List ──
  async function loadList() {
    try {
      const r = await api({ action: 'desk-list' }); S.chats = r.chats || [];
      const w = $('emailDeliveryWarning'); w.hidden = !r.delivery?.pending;
      w.textContent = r.delivery?.pending ? `${r.delivery.pending} email notification(s) queued. Delivery retries while Support is open; students can still read replies in the app.` : '';
    } catch (e) { if (e.stale) return; $('items').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    alertNew();
    renderFolders(); renderList();
  }
  const tagsFor = c => [
    c.status === 'waiting' ? (c.kind === 'refund' ? '<span class="tag refund">💸 Refund</span>' : '<span class="tag waiting">Needs reply</span>')
      : c.status === 'replied' ? '<span class="tag replied">Waiting on student</span>' : c.status === 'closed' ? '<span class="tag closed">Solved</span>' : '<span class="tag">Knox Support only</span>',
    c.kind === 'refund' && c.status !== 'waiting' && c.status !== 'closed' ? '<span class="tag refund">💸 Refund</span>' : '',
    c.kind === 'refund' && c.refundEligible === true ? '<span class="tag ok">In window</span>' : c.kind === 'refund' && c.refundEligible === false ? '<span class="tag">Window passed</span>' : '',
    c.assignedTo ? `<span class="tag${c.assignedTo.uid === S.me?.uid ? ' mine' : ''}">👤 ${esc(c.assignedTo.uid === S.me?.uid ? 'You' : c.assignedTo.name)}</span>` : '',
  ].join('');
  function renderList() {
    const f = (FOLDERS.find(x => x[0] === S.folder) || FOLDERS[0]);
    $('listTitle').textContent = f[2];
    const q = S.q.trim().toLowerCase();
    const list = S.chats.filter(f[3]).filter(c => !q || [c.name, c.email, c.title, c.last?.text].join(' ').toLowerCase().includes(q));
    // Oldest first when work is waiting (first come, first served); newest first otherwise.
    if (['needs', 'mine', 'unassigned', 'refunds'].includes(S.folder)) list.sort((a, b) => a.updatedAt - b.updatedAt);
    $('items').innerHTML = list.length ? list.map(c => `<button class="item${c.id === S.id ? ' on' : ''}${c.teamUnread ? ' new' : ''}" data-id="${esc(c.id)}">
        <div class="item-top"><b>${esc(c.name || c.email || 'Student')}</b><time>${ago(c.updatedAt)}</time></div>
        <p>${esc(c.last ? (c.last.from === 'user' ? '' : c.last.from === 'team' ? (c.last.by || 'Team') + ': ' : 'Knox Support: ') + c.last.text : c.title)}</p>
        <div class="tags">${tagsFor(c)}</div></button>`).join('')
      : `<div class="empty">${S.folder === 'needs' ? 'All caught up 🎉<br>Nobody is waiting on a reply.' : q ? 'Nothing matches that search.' : 'Nothing here.'}</div>`;
  }
  $('items').onclick = e => { const b = e.target.closest('.item'); if (b) openChat(b.dataset.id); };
  $('search').oninput = e => { S.q = e.target.value; renderList(); };

  // ── Conversation ──
  async function openChat(id) {
    S.id = id; S.charges = null; S.page = null; showPage(null); renderFolders(); renderList();
    $('main').classList.add('has-chat');
    history.replaceState(null, '', '#c-' + id);
    $('view').innerHTML = '<div class="conv"><div class="empty" style="margin:auto">Loading…</div></div>';
    try {
      const r = await api({ action: 'desk-get', id });
      if (S.id !== id) return;
      S.chat = r.chat; S.extra = { account: r.account, history: r.history || [], hasBilling: r.hasBilling };
      const s = S.chats.find(c => c.id === id); if (s) s.teamUnread = false;
    } catch (e) { $('view').innerHTML = `<div class="conv"><div class="empty" style="margin:auto">${esc(e.message)}</div></div>`; return; }
    renderChat(true);
    renderList();
  }

  function timeline(c) {
    const items = [
      ...c.messages.map(m => ({ ...m, kind: m.note ? 'sys' : m.from })),
      ...c.notes.map(n => ({ ...n, kind: n.system ? 'sys' : 'note' })),
    ].sort((a, b) => a.at - b.at);
    return items.map(m => {
      if (m.kind === 'sys') return `<div class="sys">${esc(m.text)}${m.by ? ` · ${esc(m.by)}` : ''} · ${when(m.at)}</div>`;
      if (m.kind === 'note') return `<div class="note"><small>🔒 Internal note · ${esc(m.by)} · ${when(m.at)} — the student can't see this</small>${esc(m.text)}</div>`;
      const who = m.kind === 'user' ? esc(S.chat.name || 'Student') : m.kind === 'team' ? esc(m.by || 'Knox team') : 'Knox Support (AI)';
      return `<div class="msg ${m.kind}"><small>${who} · ${when(m.at)}</small><div class="bubble">${esc(m.text)}</div></div>`;
    }).join('');
  }

  const STATUS_NAME = { open: 'Knox Support only', waiting: 'Needs a reply', replied: 'Waiting on student', closed: 'Solved' };
  function factsHtml(t) {
    return esc(t || '').replace(/STILL INSIDE the window/, '<span class="inside">STILL INSIDE the window</span>').replace(/the window has PASSED/, '<span class="passed">the window has PASSED</span>');
  }

  function renderChat(scroll) {
    const c = S.chat, x = S.extra || {};
    const old = $('draft'), draft = old?.value || '', focused = old && document.activeElement === old, sel = focused ? [old.selectionStart, old.selectionEnd] : null;
    const team = S.team.length ? S.team : [];
    const assignOpts = [`<option value="">Unassigned</option>`, `<option value="me"${c.assignedTo?.uid === S.me.uid ? ' selected' : ''}>Me (${esc(S.me.name)})</option>`,
      ...team.filter(a => a.uid !== S.me.uid).map(a => `<option value="${esc(a.uid)}"${c.assignedTo?.uid === a.uid ? ' selected' : ''}>${esc(a.name || a.email)}</option>`)];
    if (c.assignedTo && c.assignedTo.uid !== S.me.uid && !team.some(a => a.uid === c.assignedTo.uid)) assignOpts.push(`<option value="${esc(c.assignedTo.uid)}" selected>${esc(c.assignedTo.name)}</option>`);
    const closed = c.status === 'closed';
    $('view').innerHTML = `<div class="conv">
        <div class="conv-head">
          <button class="btn ghost small back-btn" id="backBtn">← Back</button>
          <div class="t"><b>${esc(c.name || c.email || 'Student')}</b><span>${esc(c.email || '')} · started ${when(c.createdAt || c.updatedAt)}</span></div>
          <div class="tags">${tagsFor(c)}</div>
          <select id="assign" aria-label="Assign">${assignOpts.join('')}</select>
          ${closed ? '<button class="btn ghost small" id="reopenBtn">Reopen</button>' : '<button class="btn green small" id="solveBtn">✓ Solve</button>'}
        </div>
        <div class="thread" id="thread">${timeline(c)}</div>
        ${closed ? `<div class="closed-bar"><span>✅ Solved${c.solvedBy ? ' by ' + esc(c.solvedBy) : ''}${c.solvedAt ? ' · ' + when(c.solvedAt) : ''}. If the student writes again it comes back here.</span></div>` : ''}
        <div class="composer${S.mode === 'note' ? ' note-mode' : ''}">
          <div class="modes">
            <button class="mode${S.mode === 'reply' ? ' on' : ''}" data-mode="reply">Reply to student</button>
            <button class="mode${S.mode === 'note' ? ' on' : ''}" data-mode="note">🔒 Internal note</button>
            <select id="saved" aria-label="Saved replies"><option value="">⚡ Saved replies…</option>${S.replies.map((r, i) => `<option value="${i}">${esc(r.title)}</option>`).join('')}</select>
          </div>
          <textarea id="draft" placeholder="${S.mode === 'note' ? 'Note for the team — the student won’t see this' : `Reply to ${esc(c.name || 'the student')} — they see it in Knox and get an email`}" maxlength="4000"></textarea>
          <div class="send-row">
            <span class="hint">${navigator.platform.includes('Mac') ? '⌘' : 'Ctrl'}+Enter to send</span>
            ${S.mode === 'note' ? '<button class="btn" id="sendBtn" style="background:#E0B100;box-shadow:0 3px 0 #A88500">Add note</button>'
              : `<button class="btn ghost" id="sendSolveBtn">Send & solve</button><button class="btn" id="sendBtn">Send reply</button>`}
          </div>
        </div>
      </div>
      <aside class="side">
        <div><h4>Account</h4><p class="facts">${x.account ? factsHtml(x.account) : 'Loading…'}</p></div>
        ${refundBox(c, x)}
        <div><h4>Other conversations</h4><div class="mini">${(x.history || []).length ? x.history.map(h => `<button data-open="${esc(h.id)}">${esc(h.title || 'Conversation')}<span>${ago(h.updatedAt)} · ${STATUS_NAME[h.status] || h.status}</span></button>`).join('') : '<span class="facts" style="color:var(--text-light)">None</span>'}</div></div>
        <div><h4>Details</h4><p class="facts" style="color:var(--text-light)">Student ID: ${esc(c.uid)}\nConversation: ${esc(c.id)}${c.firstReplyAt ? '\nFirst team reply: ' + when(c.firstReplyAt) : ''}</p></div>
      </aside>`;
    const d = $('draft'); d.value = draft;
    if (focused) { d.focus({ preventScroll: true }); d.setSelectionRange(sel[0], sel[1]); }
    if (scroll) { const t = $('thread'); t.scrollTop = t.scrollHeight; }
  }

  function refundBox(c, x) {
    if (!S.me.canRefund) return c.kind === 'refund' ? `<div><h4>Refund</h4><p class="facts" style="color:var(--text-light)">You can't issue refunds. Leave an internal note (“Refund OK”) and assign it to Sion.</p></div>` : '';
    if (!x.hasBilling) return `<div><h4>Refund</h4><p class="facts" style="color:var(--text-light)">No card payments on this account.</p></div>`;
    const done = (c.refunds || []).map(r => `<div class="sys" style="align-self:stretch">Refunded ${(r.amount / 100).toLocaleString('en-US', { style: 'currency', currency: (r.currency || 'usd').toUpperCase() })} · ${esc(r.by)} · ${when(r.at)}</div>`).join('');
    if (!S.charges) return `<div><h4>Refund</h4>${done}<button class="btn ghost small" id="loadCharges">Show payments</button></div>`;
    if (S.charges.error) return `<div><h4>Refund</h4><p class="err-msg">${esc(S.charges.error)}</p></div>`;
    return `<div><h4>Refund</h4>${done}<div class="mini">${S.charges.charges.length ? S.charges.charges.map(ch => `<div class="charge"><div><b>${esc(ch.label)}</b><span>${new Date(ch.created).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })} · ${esc(ch.description)}</span></div>
        ${ch.fullyRefunded ? '<span class="tag closed">Refunded</span>' : `<button class="btn red small" data-refund="${esc(ch.id)}" data-label="${esc(ch.label)}">Refund</button>`}</div>`).join('') : '<span class="facts">No payments found.</span>'}</div>
      ${S.charges.hasSubscription ? '<label class="check"><input type="checkbox" id="alsoCancel" checked> Also cancel their plan now</label>' : ''}</div>`;
  }

  async function send(solve) {
    const d = $('draft'), text = d.value.trim();
    if (!text) return d.focus();
    const btns = document.querySelectorAll('#sendBtn, #sendSolveBtn'); btns.forEach(b => b.disabled = true);
    try {
      const r = S.mode === 'note' ? await api({ action: 'desk-note', id: S.id, text }) : await api({ action: 'desk-reply', id: S.id, text, solve });
      d.value = ''; S.chat = r.chat; renderChat(true);
      toast(S.mode === 'note' ? 'Note added' : solve ? 'Sent and solved ✓' : 'Reply sent ✓');
      loadList();
    } catch (e) { toast(e.message); btns.forEach(b => b.disabled = false); }
  }

  $('view').addEventListener('click', async e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'backBtn') { S.id = null; $('main').classList.remove('has-chat'); history.replaceState(null, '', location.pathname); renderList(); return; }
    if (t.dataset.mode) { S.mode = t.dataset.mode; renderChat(false); $('draft').focus(); return; }
    if (t.id === 'sendBtn') return send(false);
    if (t.id === 'sendSolveBtn') return send(true);
    if (t.dataset.open) return openChat(t.dataset.open);
    if (t.id === 'solveBtn' || t.id === 'reopenBtn') {
      try { S.chat = (await api({ action: 'desk-status', id: S.id, status: t.id === 'solveBtn' ? 'closed' : 'waiting' })).chat; renderChat(false); loadList(); toast(t.id === 'solveBtn' ? 'Solved ✓' : 'Reopened'); } catch (err) { toast(err.message); }
      return;
    }
    if (t.id === 'loadCharges') {
      t.disabled = true;
      try { S.charges = await api({ action: 'desk-charges', id: S.id }); } catch (err) { S.charges = { error: err.message }; }
      renderChat(false); return;
    }
    if (t.dataset.refund) {
      const cancel = $('alsoCancel')?.checked === true;
      if (!confirm(`Refund ${t.dataset.label} to ${S.chat.email || 'this student'}${cancel ? ' and cancel their plan now' : ''}?\n\nThis sends the money back right away and can't be undone.`)) return;
      t.disabled = true;
      try {
        const r = await api({ action: 'desk-refund', id: S.id, chargeId: t.dataset.refund, cancel });
        toast(`Refunded ${r.refunded}${r.cancelled ? ' · plan cancelled' : ''}`);
        S.charges = null; await openChat(S.id);
      } catch (err) { toast(err.message); t.disabled = false; }
    }
  });
  $('view').addEventListener('change', async e => {
    if (e.target.id === 'saved' && e.target.value !== '') {
      const r = S.replies[+e.target.value], d = $('draft');
      const name = (S.chat.name || '').split(' ')[0];
      const text = r.text.replace(/^Hi!/, name ? `Hi ${name}!` : 'Hi!');
      d.value = d.value.trim() ? d.value.trimEnd() + '\n\n' + text : text;
      e.target.value = ''; d.focus();
    }
    if (e.target.id === 'assign') {
      try { S.chat = (await api({ action: 'desk-assign', id: S.id, to: e.target.value || null })).chat; renderChat(true); loadList(); toast('Assigned'); } catch (err) { toast(err.message); }
    }
  });
  $('view').addEventListener('keydown', e => { if (e.target.id === 'draft' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(false); } });

  // ── Pages ──
  function showPage(name) {
    const page = $('page');
    page.hidden = !name; $('listPane').hidden = !!name; $('view').hidden = !!name;
    if (name) $('main').classList.remove('has-chat');
    if (!name) return;
    if (name === 'team') return renderTeam();
    if (name === 'replies') return renderReplies();
    if (name === 'guide') return renderGuide();
    if (name === 'settings') return renderSettings();
  }

  async function loadTeam() { if (S.me) { try { S.team = (await api({ action: 'desk-team' })).team || []; } catch {} } }

  async function renderTeam() {
    const page = $('page');
    page.innerHTML = '<div class="page-inner"><h2>Team</h2><p class="lead">Loading…</p></div>';
    await loadTeam();
    page.innerHTML = `<div class="page-inner">
      <h2>Team</h2>
      <p class="lead">Add the people you hire. They sign in at <b>${location.host}/support-desk</b> with their Knox account (they need to sign up at knoxknowsapp.com first). They can reply, leave internal notes, assign and solve. Turn on <b>Can refund</b> only for people you trust with money.</p>
      <div class="card"><h3>Add someone</h3>
        <form class="row-form" id="addForm">
          <input class="field" id="aEmail" type="email" placeholder="their@email.com" required>
          <input class="field" id="aName" placeholder="Name students see (e.g. Maya)" maxlength="40">
          <label class="check" style="margin:0"><input type="checkbox" id="aRefund"> Can refund</label>
          <button class="btn" type="submit">Add</button>
        </form><div class="err-msg" id="addMsg"></div></div>
      <div class="card"><h3>People (${S.team.length})</h3>
        ${S.team.length ? S.team.map(a => `<div class="person"><div class="pi"><b>${esc(a.name || a.email)}${a.owner ? ' · Owner' : ''}</b><span>${esc(a.email || '')}${a.addedAt ? ' · added ' + new Date(a.addedAt).toLocaleDateString() : ''}</span></div>
          ${a.owner ? '' : `<label class="check" style="margin:0"><input type="checkbox" data-refund-for="${esc(a.uid)}" ${a.canRefund ? 'checked' : ''}> Can refund</label>
          <button class="btn ghost small" data-remove="${esc(a.uid)}" data-name="${esc(a.name || a.email)}">Remove</button>`}</div>`).join('') : '<p class="lead">Nobody yet — add your first teammate above.</p>'}
      </div></div>`;
    $('addForm').onsubmit = async e => {
      e.preventDefault();
      try { await api({ action: 'desk-team-save', email: $('aEmail').value, name: $('aName').value, canRefund: $('aRefund').checked }); toast('Added to the team'); renderTeam(); }
      catch (err) { $('addMsg').textContent = err.message; }
    };
    page.querySelectorAll('[data-refund-for]').forEach(cb => cb.onchange = async () => {
      const a = S.team.find(x => x.uid === cb.dataset.refundFor);
      try { await api({ action: 'desk-team-save', email: a.email, name: a.name, canRefund: cb.checked, notify: a.notify !== false }); toast(cb.checked ? 'Can refund now' : 'Refund access removed'); } catch (err) { toast(err.message); cb.checked = !cb.checked; }
    });
    page.querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => {
      if (!confirm(`Remove ${b.dataset.name} from the support team? They won't be able to open the Support Desk.`)) return;
      try { await api({ action: 'desk-team-remove', uid: b.dataset.remove }); toast('Removed'); renderTeam(); } catch (err) { toast(err.message); }
    });
  }

  function renderReplies() {
    const owner = S.me.role === 'owner', page = $('page');
    page.innerHTML = `<div class="page-inner">
      <h2>Saved replies</h2>
      <p class="lead">Ready-made answers for the most common questions. Pick one from “⚡ Saved replies” while replying — it’s added to your message so you can edit it first. “Hi!” becomes “Hi Maya!” automatically.${owner ? '' : ' Only Sion can change these.'}</p>
      <div class="card" id="replyList">${S.replies.map((r, i) => owner ? `<div class="reply-edit"><input class="field" data-rt="${i}" value="${esc(r.title)}" maxlength="60"><textarea class="field" data-rx="${i}" maxlength="2000">${esc(r.text)}</textarea><div><button class="btn ghost small" data-del="${i}">Delete</button></div></div>`
        : `<div class="reply-edit"><b>${esc(r.title)}</b><span class="facts">${esc(r.text)}</span></div>`).join('') || '<p class="lead">No saved replies yet.</p>'}</div>
      ${owner ? '<div class="row-form"><button class="btn ghost" id="addReply">+ Add a saved reply</button><button class="btn" id="saveReplies">Save changes</button><span class="ok-msg" id="repMsg"></span></div>' : ''}</div>`;
    if (!owner) return;
    const collect = () => S.replies.map((r, i) => ({ title: page.querySelector(`[data-rt="${i}"]`)?.value || '', text: page.querySelector(`[data-rx="${i}"]`)?.value || '' }));
    $('addReply').onclick = () => { S.replies = [...collect(), { title: 'New reply', text: 'Hi! ' }]; renderReplies(); };
    page.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const l = collect(); l.splice(+b.dataset.del, 1); S.replies = l; renderReplies(); });
    $('saveReplies').onclick = async () => {
      try { S.replies = (await api({ action: 'desk-replies-save', list: collect() })).replies; renderReplies(); toast('Saved replies updated'); } catch (err) { toast(err.message); }
    };
  }

  function renderGuide() {
    $('page').innerHTML = `<div class="page-inner guide">
      <h2>How we help at Knox</h2>
      <p class="lead">Students (and parents) write to Knox Support from the orange fox button in the app. An AI answers simple questions; when they want a refund or a person, the conversation lands in <b>Needs a reply</b>.</p>
      <div class="card"><h3>Your workflow</h3><ul>
        <li>Work <b>Needs a reply</b> from the top — oldest first. Assign it to yourself so nobody doubles up.</li>
        <li>Check the <b>Account</b> panel: plan, monthly/yearly, trial, first payment and whether they're inside the refund window.</li>
        <li>Reply in plain, friendly words. Students see your first name and get an email. Aim to reply within a day.</li>
        <li>Use <b>🔒 Internal notes</b> for anything the team should know — students never see notes.</li>
        <li>When it's done, <b>Send & solve</b> (or ✓ Solve). If they write back, it comes back to the inbox.</li>
      </ul></div>
      <div class="card"><h3>Refund policy</h3><ul>
        <li><b>Monthly plans:</b> full refund within <b>7 days</b> of the first payment.</li>
        <li><b>Yearly plans:</b> full refund within <b>14 days</b> of the first payment.</li>
        <li><b>Bought before November 1, 2026:</b> they keep the old <b>30-day</b> window.</li>
        <li><b>Renewals</b> and payments outside the window aren't refundable — they can cancel anytime and keep their plan until the end of the time paid for.</li>
        <li><b>Gift codes:</b> refundable only if not redeemed yet.</li>
        <li>Free trial (Mega Knox monthly, 3 days): cancelling during the trial means no charge — nothing to refund.</li>
        <li>If you can refund: open the conversation → <b>Refund</b> → Show payments → Refund, and usually leave “Also cancel their plan now” on. Then send the “Refund approved” saved reply. Can't refund? Leave a note “Refund OK” and assign it to Sion.</li>
      </ul></div>
      <div class="card"><h3>Good to know</h3><ul>
        <li>Plans: Free (10 questions to start, 5 more each day), Knox Plus $9.99/mo or $79.99/yr, Mega Knox $12.99/mo or $99.99/yr.</li>
        <li>Cancel: profile → Account &amp; Plan → Manage Billing. Plan not showing: same email they paid with, then refresh.</li>
        <li>Gift codes: profile → Redeem a code, or knoxknowsapp.com/redeem. Discord: /link connects their account.</li>
        <li>Never ask for passwords or card numbers. Don't share one student's details with anyone else — parents included, unless it's clearly their own account.</li>
        <li>Homework questions → point them to Ask Knox or Learn. Bugs → note the details and assign to Sion.</li>
      </ul></div></div>`;
  }

  function renderSettings() {
    $('page').innerHTML = `<div class="page-inner">
      <h2>My settings</h2>
      <div class="card"><h3>Your name</h3><p class="lead" style="margin-bottom:10px">Students see this on your replies (first name is best).</p>
        <form class="row-form" id="nameForm"><input class="field" id="myName" value="${esc(S.me.name)}" maxlength="40" required><button class="btn" type="submit">Save</button></form></div>
      <div class="card"><h3>Email alerts</h3>
        <label class="check"><input type="checkbox" id="myNotify" ${S.me.notify ? 'checked' : ''}> Email me (${esc(S.me.email || '')}) when a student needs a reply</label></div>
      <div class="card"><h3>Desktop alerts</h3><p class="lead" style="margin-bottom:10px">A sound and a pop-up when someone new needs a reply while the Support Desk is open.</p>
        <button class="btn ghost" id="alerts2">${S.alerts ? 'Turn off' : 'Turn on'} desktop alerts</button></div>
      <p class="lead">Signed in as ${esc(S.me.email || '')} · ${S.me.role === 'owner' ? 'Owner' : 'Support team'}${S.me.canRefund ? ' · can refund' : ''}</p></div>`;
    $('nameForm').onsubmit = async e => { e.preventDefault(); try { S.me = (await api({ action: 'desk-me-save', name: $('myName').value })).me; $('whoAmI').innerHTML = `<b>${esc(S.me.name)}</b> · ${S.me.role === 'owner' ? 'Owner' : 'Support team'}`; toast('Saved'); } catch (err) { toast(err.message); } };
    $('myNotify').onchange = async e => { try { S.me = (await api({ action: 'desk-me-save', notify: e.target.checked })).me; toast(e.target.checked ? 'Email alerts on' : 'Email alerts off'); } catch (err) { toast(err.message); } };
    $('alerts2').onclick = () => toggleAlerts().then(renderSettings);
  }

  // ── Alerts ──
  function syncAlertsBtn() { $('alertsBtn').textContent = S.alerts ? '🔔 Alerts on' : '🔕 Alerts off'; }
  async function toggleAlerts() {
    if (!S.alerts && 'Notification' in window && Notification.permission !== 'granted') await Notification.requestPermission();
    S.alerts = !S.alerts && (!('Notification' in window) || Notification.permission === 'granted');
    try { localStorage.setItem('knoxDeskAlerts', S.alerts ? 'on' : 'off'); } catch {}
    syncAlertsBtn(); if (S.alerts) beep();
  }
  $('alertsBtn').onclick = toggleAlerts;
  function beep() {
    try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(.12, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .35); o.start(); o.stop(a.currentTime + .35); } catch {}
  }
  function alertNew() {
    const waiting = new Set(S.chats.filter(c => c.status === 'waiting').map(c => c.id + ':' + c.updatedAt));
    if (S.seenWaiting && S.alerts) {
      const fresh = S.chats.filter(c => c.status === 'waiting' && !S.seenWaiting.has(c.id + ':' + c.updatedAt));
      if (fresh.length) {
        beep();
        try { const c = fresh[0]; const n = new Notification(c.kind === 'refund' ? 'Refund request' : 'New message', { body: `${c.name || c.email || 'A student'}: ${c.last?.text || ''}`, icon: '/knox-logo-square.jpg' }); n.onclick = () => { window.focus(); openChat(c.id); }; } catch {}
      }
    }
    S.seenWaiting = waiting;
  }

  // ── Live updates: the list every 10s, the open conversation every 5s ──
  let tick = 0;
  setInterval(async () => {
    if (!S.me || document.visibilityState !== 'visible' && !S.alerts) return;
    tick++;
    if (tick % 2 === 0) await loadList();
    if (tick % 60 === 0) loadTeam();
    if (S.id && !S.page && S.chat) {
      try {
        const id = S.id, r = await api({ action: 'desk-get', id, light: true });
        if (S.id !== id) return;
        // Conversations keep their newest 120 messages, so compare the newest too.
        const sig = c => [c.messages.length, c.messages.at(-1)?.at, c.notes.length, c.notes.at(-1)?.at, c.status, c.assignedTo?.uid, (c.refunds || []).length].join(':');
        if (sig(r.chat) !== sig(S.chat)) {
          const t = $('thread'), atBottom = t && t.scrollHeight - t.scrollTop - t.clientHeight < 60;
          S.chat = r.chat; renderChat(atBottom);
        }
      } catch {}
    }
  }, 5000);
  window.addEventListener('focus', () => { if (S.me) loadList(); });
</script>
</body>
</html>
